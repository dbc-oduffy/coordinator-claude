# Web research, pass 1. The deepening pass is its own fire: web-deepening.manifest.yaml.
# Topic letters are lowercase: {{item}} is bound verbatim into role names and file names.
schema_version: 1
pipeline: web
description: Scout builds a corpus, specialists research and challenge through mailboxes, a rebuttal round answers challenges, an Opus sweep synthesizes.
inputs:
  brief: required
  scratch_dir: optional
  lists:
    topics:
      kind: strings
stages:
  - id: scope
    phase: Scope
    agent_type: general-purpose
    model: sonnet
    template: web-scope-prompt-template.md
    produces_brief: true
    output: "{{scratch_dir}}/scope.md"
  - id: prior-art
    phase: Scope
    agent_type: coordinator:prior-art-checker
    model: sonnet
    template: prior-art-prompt-template.md
    optional: true
    depends_on: [scope]
    output: "{{scratch_dir}}/prior-art-check.md"
  - id: scout
    phase: Scout
    agent_type: coordinator:research-scout
    model: haiku
    template: scout-prompt-template.md
    web_caller: true
    depends_on: [scope]
    output: "{{scratch_dir}}/source-corpus.md"
  - id: specialists
    phase: Specialists
    agent_type: coordinator:research-specialist
    model: sonnet
    template: specialist-prompt-template.md
    fan_out:
      over: inputs.topics
    web_caller: true
    depends_on: [scout]
    output: "{{scratch_dir}}/{{item}}-claims.json"
    schema:
      type: object
      properties:
        letter:
          type: string
        challenged:
          type: array
          items:
            type: string
        claimsPath:
          type: string
      required: [letter, challenged, claimsPath]
  - id: rebuttal
    phase: Rebuttal
    agent_type: coordinator:research-specialist
    model: sonnet
    template: web-rebuttal-prompt-template.md
    fan_out:
      over: stage.specialists.return.challenged
    web_caller: true
    depends_on: [specialists]
    output: "{{scratch_dir}}/{{item}}-claims.json"
  - id: sweep
    phase: Sweep
    agent_type: coordinator:research-synthesizer
    model: opus
    template: web-sweep-prompt-template.md
    web_caller: true
    depends_on: [rebuttal]
    output: "{{scratch_dir}}/synthesis.md"
    schema:
      type: object
      properties:
        deepeningRecommended:
          type: boolean
        summary:
          type: string
      required: [deepeningRecommended, summary]
  - id: relay
    phase: Relay
    agent_type: coordinator:research-specialist
    model: sonnet
    template: web-relay-prompt-template.md
    when:
      return: stage.sweep.return.deepeningRecommended
    fan_out:
      over: inputs.topics
    depends_on: [sweep]
    output: "{{scratch_dir}}/relay-{{item}}.md"
  - id: sweep-continuation
    phase: Relay
    agent_type: coordinator:research-synthesizer
    model: opus
    template: web-sweep-prompt-template.md
    when:
      return: stage.sweep.return.deepeningRecommended
    web_caller: true
    depends_on: [relay]
    output: "{{scratch_dir}}/synthesis.md"
    schema:
      type: object
      properties:
        deepeningRecommended:
          type: boolean
        summary:
          type: string
      required: [deepeningRecommended, summary]
  - id: coverage
    phase: Coverage
    agent_type: coordinator:coverage-auditor
    model: sonnet
    template: web-coverage-prompt-template.md
    depends_on: [sweep, sweep-continuation]
    output: "{{scratch_dir}}/coverage-audit.md"
    schema:
      type: object
      properties:
        sidecarPath:
          type: string
        absentClaims:
          type: integer
        deepeningRecommended:
          type: boolean
      required: [sidecarPath, absentClaims, deepeningRecommended]

schema_version: 1
pipeline: structured
description: "Structured research, one subject at a time: scope, optional prior-art, scout, per-topic verifiers, a rebuttal round, a schema-conforming synthesizer, a coverage audit"
subjects_mode: sequential
inputs:
  brief: required
  subjects: optional
  scratch_dir: optional
stages:
  - id: scope
    phase: Scope
    agent_type: general-purpose
    model: sonnet
    template: structured-scope-prompt-template.md
    produces_brief: true
    output: "{{scratch_dir}}/scout-brief.md"
  - id: prior-art
    phase: Scope
    agent_type: coordinator:prior-art-checker
    model: sonnet
    template: prior-art-prompt-template.md
    optional: true
    depends_on: [scope]
    output: "{{scratch_dir}}/prior-art-check.md"
  - id: scout
    phase: Scout
    agent_type: coordinator:research-scout
    model: haiku
    template: structured-scout-prompt-template.md
    fan_out: none
    web_caller: true
    depends_on: [scope, prior-art]
    output: "{{scratch_dir}}/scout-index.md"
  - id: verify
    phase: Verify
    agent_type: coordinator:research-specialist
    model: sonnet
    template: structured-verifier-prompt-template.md
    fan_out:
      over: subject.verifiers
    web_caller: true
    depends_on: [scout]
    output: "{{scratch_dir}}/{{item.topic}}-findings.md"
    schema:
      type: object
      required: [topic, challenged]
      properties:
        topic: { type: string }
        challenged: { type: array, items: { type: string } }
  - id: rebuttal
    phase: Rebuttal
    agent_type: coordinator:research-specialist
    model: sonnet
    template: structured-rebuttal-prompt-template.md
    fan_out:
      over: stage.verify.return.challenged
    web_caller: true
    depends_on: [verify]
    output: "{{scratch_dir}}/{{item}}-findings.md"
    schema:
      type: object
      required: [topic, challenged]
      properties:
        topic: { type: string }
        challenged: { type: array, items: { type: string } }
  - id: synthesize
    phase: Synthesize
    agent_type: coordinator:structured-synthesizer
    model: opus
    template: structured-synthesizer-prompt-template.md
    fan_out: none
    web_caller: false
    depends_on: [verify, rebuttal]
    output: "{{scratch_dir}}/synthesis-annotations.md"
  - id: coverage
    phase: Coverage
    agent_type: coordinator:coverage-auditor
    model: sonnet
    template: structured-coverage-prompt-template.md
    fan_out: none
    web_caller: false
    depends_on: [synthesize]
    output: "{{scratch_dir}}/coverage-audit.md"
    schema:
      type: object
      required: [sidecarPath, absentClaims]
      properties:
        sidecarPath: { type: string }
        absentClaims: { type: integer }

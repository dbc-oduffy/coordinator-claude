schema: docs-check-sidecar
applies_to: "docs/plans/*docs-check.md"
kinds: [docs-check-sidecar, docs-check]
required:
  artifact: string
optional:
  checker: string
  claims_checked: number
  verified: number
  unverified: number
  incorrect: number
  auto_fixed: number
  verification_source: string
  created: iso-date
  status: string
  title: string


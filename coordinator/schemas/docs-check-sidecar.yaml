schema: docs-check-sidecar
applies_to: "docs/plans/*.docs-check.md"
kinds: [docs-check-sidecar, docs-check]
required:
  artifact: string
optional:
  checker: string
  claims_checked: number
  verified: number
  unverified: number
  incorrect: number
  auto_fixed: number
  verification_source: string
  created: iso-date
  status: string
  title: string

# Spec backlink: docs/plans/2026-06-23-deliverable-type-schema-taxonomy.md § C1
# required: artifact (the plan/doc this sidecar checks) rather than plan — docs-checker
# emits `artifact:` not `plan:` per inventory findings.
# applies_to (tc-1 C3): *.docs-check.md is the canonical single-.md suffix form (dot before
# "docs-check"). globToRegex compiles * → [^/]* so the glob covers both <plan-stem>.docs-check.md
# (canonical) and <plan-stem>.md.docs-check.md (legacy double-.md form, ported by tc-1 C9).
# Negative-spec: do NOT add status enum — legacy value "reviewed" is off the plan-schema enum
# and that off-enum mismatch was the documented fight-the-hook trigger (Substrate Fact #5).
#
# Sidecar-family section grammar (shared core, tc-1 C3 — applies to all four sidecar types):
# every sidecar carries: ## Summary (or a top-level verdict line) + ## Findings.
# Cross-ref: plugins/coordinator-claude/coordinator/docs/wiki/canonical-artifact-shapes.md
# § tc-1 — Record-family doctrine (D5).

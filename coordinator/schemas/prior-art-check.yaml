schema: prior-art-check
applies_to: "docs/plans/*.prior-art-check.md"
kinds: [prior-art-check]
required:
  plan: string
optional:
  author: string
  created: iso-date
  status: string
  conflicts: number
  compatible: number
  silent: number
  title: string

# Spec backlink: docs/plans/2026-06-23-deliverable-type-schema-taxonomy.md § C1

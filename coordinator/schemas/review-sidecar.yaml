schema: review-sidecar
applies_to: "docs/plans/*.review.md"
kinds: [staff-eng-review, eng-director-review, staff-ux-review, staff-game-dev-review, staff-data-sci-review, senior-front-end-review, code-review, plan-review, review, review-sidecar, patrik-review, substrate-adjudication, plan-rereview]
required:
  plan: string
optional:
  reviewer: string
  verdict: string
  created: iso-date
  author: string
  title: string
  status: string
  findings_count: number
  diff_sha: string
  mode: string
  predecessor_review: string
  prior_art_check: string
  scope: string

# kinds list: role-based canonical values FIRST (staff-eng-review, eng-director-review, etc.),
# then legacy disk-census values (plan-review x6, review x5, code-review x4, review-sidecar x3,
# patrik-review x3, substrate-adjudication x1, plan-rereview x1) retained as resolvers.
# Spec backlink: docs/plans/2026-06-23-deliverable-type-schema-taxonomy.md § Decision 2
# Negative-spec: do NOT add plan-only enum fields (e.g. status enum) — that recreates fight-the-hook.
#
# applies_to (tc-1 C3): canonical single-.md suffix is *.review.md (dot separator, not dash).
# globToRegex compiles * → [^/]* so *.review.md spans all reviewer-persona suffixes and both the
# canonical <plan-stem>.review.md form and the legacy <plan-stem>.md.review.md double-.md form;
# the double-.md form is ported to the canonical single-.md form by the tc-1 C9 broadsword pass.
# The legacy *-review.md (dash) glob is retired here; irregular reviewer/iteration distinctions
# previously encoded in filenames are captured in frontmatter after C9 (kinds resolvers retained).
#
# Iteration sidecar form (tc-1 C9b): when a plan receives a second or Nth distinct-reviewer
# sidecar, the file is named <plan-stem>.review-N.md (N ≥ 2 integer; dot separator before
# "review"). The reviewer persona is captured in the reviewer: frontmatter field; the numeric
# suffix disambiguates the file on disk. This is the CANONICAL iteration form — NOT an anomaly.
# query-records excludes *.review-N.md silently (no anomaly warn) alongside *.review.md via the
# REVIEW_ITERATION_RE check in query-records.js § plan filter (C9b).
# applies_to stays as docs/plans/*.review.md (not widened) — widening over-matches per the
# negative-spec below; the query-side recognition handles the iteration form separately.
#
# Sidecar-family section grammar (shared core, tc-1 C3 — applies to all four sidecar types):
# every sidecar carries: ## Summary (or a top-level verdict line) + ## Findings.
# Cross-ref: plugins/coordinator-claude/coordinator/docs/wiki/canonical-artifact-shapes.md
# § tc-1 — Record-family doctrine (D5).

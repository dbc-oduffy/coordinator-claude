schema: plan
applies_to: "docs/plans/*.md"
required:
  title: string
  created: iso-date
  author: string
  status:
    type: enum
    values: [draft, reviewed, approved, executing, implemented, deferred, abandoned, superseded]
optional:
  branch: string
  reviewer: string
  source: string
  superseded_by: string
  # D1 promoted keys (2026-06-25) — de-facto keys seen on disk, now declared.
  # Spec backlink: docs/plans/2026-06-25-qffs-tc-1-records-consolidation.md § D1.
  #
  # Promoted (six keys):
  #   scope_mode           — planning posture (e.g. "architecture", "implementation", "spike")
  #   problem_set          — ratified problem-set slug or inline statement (from /shape)
  #   predecessor_handoff  — the handoff that spawned THIS plan (distinct from parent_plan)
  #   prerequisite_of      — downstream plan(s) that depend on this plan completing first
  #   source_memo          — cross-repo memo that initiated this plan
  #   scope                — borrowed from handoff schema; lists in-scope items (list-of-string)
  #
  # Tolerated-legacy keys (recognized but NOT promoted — do not add to optional above):
  #   parent_plan       — refers to a parent PLAN, not a handoff; kept distinct from
  #                       predecessor_handoff (different referent, not a spelling schism)
  #   research_input    — path to a /deep-research output that informed this plan
  #   borrow_disposition — lender-side accounting for a scope borrow (handoff-schema concept
  #                        that leaked into some plans; stays legacy here)
  #
  # Body-section vocabulary (canonical, not frontmatter):
  #   "## Anti-scope"   — failure modes / pitfalls that this plan is explicitly NOT trying to
  #                       prevent (execution risks, not adjacent work). DISTINCT from Out-of-scope.
  #   "## Out of scope" — adjacent work explicitly excluded from this plan's deliverables.
  #   See plugins/coordinator-claude/coordinator/docs/wiki/canonical-artifact-shapes.md
  #   § D2 — ## Anti-scope and ## Out of scope are DISTINCT canonical sections; do not collapse.
  scope_mode: string
  problem_set: string
  predecessor_handoff: string
  prerequisite_of: string
  source_memo: string
  scope: list-of-string

# status lifecycle (2026-05-20):
#   draft → reviewed → approved → executing → implemented
#   sidetracks: deferred, abandoned, superseded
#
# "implemented" means the work this plan governed is complete on its working
# branch (regression net green, last task done). Whether the branch lands on
# main is a release concern tracked via completion log + commit SHA +
# week-changelog + handoff `deployment_state:` — NOT via plan frontmatter.
# Plans flip when code is done, not when the merge ceremony runs.

schema: plan-coverage-check
applies_to: "docs/plans/*.plan-coverage-check.md"
kinds: [plan-coverage-check, coverage-check]
required:
  plan: string
optional:
  author: string
  created: iso-date
  status: string
  verdict: string
  title: string

# Spec backlink: docs/plans/2026-06-23-deliverable-type-schema-taxonomy.md § C1
# applies_to (tc-1 C3): *.plan-coverage-check.md is the canonical single-.md suffix form.
# globToRegex compiles * → [^/]* so the glob covers both <plan-stem>.plan-coverage-check.md
# (canonical) and <plan-stem>.md.plan-coverage-check.md (legacy double-.md form). The .coverage-check.md
# alias suffix is ported to .plan-coverage-check.md by the tc-1 C9 broadsword; the coverage-check
# kinds resolver above is retained for validation routing of pre-port files.
# Negative-spec: do NOT require verdict — some legacy sidecars omit it.
#
# Sidecar-family section grammar (shared core, tc-1 C3 — applies to all four sidecar types):
# every sidecar carries: ## Summary (or a top-level verdict line) + ## Findings.
# Cross-ref: plugins/coordinator-claude/coordinator/docs/wiki/canonical-artifact-shapes.md
# § tc-1 — Record-family doctrine (D5).

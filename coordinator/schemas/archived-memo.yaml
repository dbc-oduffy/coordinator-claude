schema: archived-memo
applies_to: "cross-repo/archive/*.md"
# ---------------------------------------------------------------------------
# Spec backlink: docs/plans/2026-06-23-deliverable-type-schema-taxonomy.md § C1b
#
# Archived memos live at cross-repo/archive/YYYY-MM-DD-<slug>.md. These are
# outbound cross-repo memos that have been relayed and archived in place
# (distinct from live inbox memos at cross-repo/inbox/, which use the
# cross-repo-memo schema).
#
# kinds: inline list consumed by deliverable-type indexer (later chunk).
# The loader (bin/lib/schema.js) ignores unknown top-level keys, so this
# is safe to add ahead of the indexer.
# ---------------------------------------------------------------------------
kinds: [memo, ask, fyi, consult]
required:
  from: string
  to: string
  status: string
optional:
  title: string
  created: iso-date
  related_plan: string
  related_review: string

schema: review
applies_to: "state/reviews/*.md"
required:
  title: string
  created: iso-date
  reviewer:
    type: enum
    values: [patrik, sid, camelia, pali, fru, zoli, code-reviewer]
  target: string
  findings_count:
    type: number
optional:
  branch: string
  commit: string
  disposition: string

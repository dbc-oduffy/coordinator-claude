[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"  # Review: Reviewer C C-F8 — canonical build-meta backend; backends.legacy:build is non-canonical

[project]
name = "coordinator-whoami"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18",  # Review: Reviewer C C-F9 — 4.18+ ensures stable Draft 2020-12 $ref-resolution behavior (earlier 4.x had bugs)
    "rfc3339-validator>=0.1.4",  # Review: code-reviewer F1(b) — jsonschema's optional date-time FormatChecker dep; without it date-time checks silently no-op (false-GREEN)
    "PyYAML>=6.0",  # coordinator-venv-wide: frontmatter parsing for YAML-shaped artifacts (e.g. bin/tests/test-handoff-corpus-conformance.sh); declared so a fresh venv build is self-sufficient
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"coordinator_whoami.schemas" = ["*.json"]
"coordinator_whoami.project_rag.schemas" = ["*.json"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: marks slow tests (subprocess shell-outs, real I/O, sleeps > 100ms)",
]

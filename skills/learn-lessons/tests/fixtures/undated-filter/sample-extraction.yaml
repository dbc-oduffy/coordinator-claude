# Synthetic extraction fixture for the Phase 2.5 undated-pass filter snippet.
# Mirrors the shape extract-lessons.py emits for *-extracted-full.yaml.
# Migrated from state/lessons.md line-based IDs to per-entry YAML sequential IDs 2026-06-30.
# Source paths reference per-entry YAML files in state/lessons/ (1-based sorted-file-index).
#
# Records (covering the filter polarity matrix):
# Sorted alphabetically by filename; undated files use "0000-00-00-" prefix to sort
# before dated files, matching extract-lessons.py sorted(dir.glob("*.yaml")) ordering.
#   id=sample-L1  undated=true,  tag_universal=true   → MUST be selected
#   id=sample-L2  undated=true,  tag_universal=true   → MUST be selected
#   id=sample-L3  undated=true,  tag_universal=false  → MUST NOT be selected (project-scoped)
#   id=sample-L4  undated=false, tag_universal=true   → MUST NOT be selected (dated; delta handles it)
#   id=sample-L5  undated=false, tag_universal=false  → MUST NOT be selected (neither axis)
meta:
  shortname: sample
  total_blocks_seen: 5
  undated_excluded_under_since: 3
  dated_excluded_pre_window: 0
records:
  - id: sample-L1
    source: "state/lessons/0000-00-00-undated-universal-a.yaml:1"
    title: "Undated universal — must pass"
    tag_universal: true
    undated: true
  - id: sample-L2
    source: "state/lessons/0000-00-00-undated-universal-b.yaml:2"
    title: "Another undated universal — must pass"
    tag_universal: true
    undated: true
  - id: sample-L3
    source: "state/lessons/0000-00-00-undated-project-scoped.yaml:3"
    title: "Undated project-scoped — must NOT pass (negative case A)"
    tag_universal: false
    undated: true
  - id: sample-L4
    source: "state/lessons/2026-01-04-dated-universal.yaml:4"
    title: "Dated universal — must NOT pass (negative case B; delta handles it)"
    tag_universal: true
    undated: false
  - id: sample-L5
    source: "state/lessons/2026-01-05-dated-project-scoped.yaml:5"
    title: "Dated project-scoped — must NOT pass (neither axis)"
    tag_universal: false
    undated: false

# Lane: add-existing-project. A repo built without coordinator: existing code, README, commit
# history for Phase 1.5 to read. See CONTRACT.md for the shape every lane follows.
# spec_backlink: archive/specs/2026-08/2026-08-20-repo-setup-as-a-product-surface.md (C2)
# census_backlink: state/plan-sidecars/2026-08-20-repo-setup-computed-form.census-steps.md

lane: add-existing-project
authored_against_contract_version: "1.0.0"
basis: >
  Existing code repo, no coordinator setup present. Phase 1.5's substrate read and synthesis have
  real material to work from; this lane accepts that synthesis unattended rather than pausing for
  a human ratification round-trip.

# --- AC2: every round_trip census row, pre-answered as tier-1, landed at directive-firing time,
# never left at tier 2.
round_trip_directives:
  - step_id: p1.repo-classification-ask
    engine_judgment_point_id: null
    value: working
    rationale: >
      An existing repo being onboarded via this lane is, by construction, an actively developed
      one -- the "add repo" thin door (see add-repo.yaml) is the lane for published-artifact
      registration-only. Phase 2 runs.
    resolves: [p1.classification-branch-b-stop, p2.question-set-selection]

  - step_id: p15.ratification-ask
    engine_judgment_point_id: null
    value: ratify
    rationale: >
      Accept Phase 1.5's proposed name/type/workstreams synthesis as-is with no confirmation
      round-trip. The synthesis (p15.propose-project-type, p15.propose-workstreams) is agent-work
      the engine performs against real substrate; this lane's policy is to trust it unattended.
    resolves: [p15.skip-phase2-on-ratification]

  - step_id: p2.ask-project-name
    engine_judgment_point_id: null
    value: "derived via p15.propose-project-name (README H1, else repo directory name); suppressed by the ratify answer above"
    rationale: p15.propose-project-name is already deterministic (MECHANICAL); ratification accepts it without a second ask.
    resolves: [p3a.render-claude-md, p3d.render-docs-readme]

  - step_id: p2.ask-project-type
    engine_judgment_point_id: null
    value: "derived via p1 detected_type plus p15.propose-project-type synthesis; suppressed by the ratify answer above"
    rationale: Ratification accepts the reconciled proposal (proposal wins on conflict, per the census's fixed reconciliation rule) without a second ask.
    resolves: [p3a.render-claude-md]

  - step_id: p2.ask-workstreams
    engine_judgment_point_id: null
    value: "derived via p15.propose-workstreams synthesis; suppressed by the ratify answer above"
    rationale: Ratification accepts the 1-3 proposed workstreams without a second ask.
    resolves: [p3h.orientation-cache-seed]

  - step_id: tw.ci-inference-prompt
    engine_judgment_point_id: null
    value: "yes if tw.ci-eligibility-resolve's _CROSS_PLATFORM_INFERRED signal fired, else no"
    rationale: >
      Accept the inferred cross-platform signal without a human confirmation round-trip. Never
      auto-write true absent a fired signal.
    resolves: [tw.ci-eligibility-resolve]

# --- Nine agent-work steps: named, not pre-answered. See CONTRACT.md.
second_phase_deferred:
  - p15.substrate-read
  - p15.propose-project-type
  - p15.peer-repo-candidate-extraction
  - tw.spawn-gate-exclude-set
  - tw.spawn-gate-ratchet-init
  - tw.spawn-gate-run-and-burndown
  - p15.peer-scout-dispatch-offer
  - tw.windows-console-allowlist-customize
  - tw.windows-console-suppression-tagging

# --- Policy default for every terminal offer not on the deferred list above.
terminal_offer_defaults:
  - step_id: p15.propose-workstreams
    value: accept-as-proposed
    rationale: >
      The Phase 1.5 synthesis output feeds p2.ask-workstreams directly, per the ratify answer
      above -- no additional confirmation step.

  - step_id: p3d5.hand-section-prompt
    value: defer
    rationale: Leave the two HAND sections as placeholders; report Needs Attention.

  - step_id: p3f.untrack-scratch-offer
    value: decline
    rationale: >
      Never auto-run `git rm --cached` (census's own never-auto-untrack rule); skip and surface
      Needs Attention.

  - step_id: p3f5.custom-hook-skip
    value: "no, unless a custom hook is present"
    rationale: >
      Install the standard post-commit hook by default. If a custom auto-push hook is detected,
      DEFER the install (skip, report Needs Attention) rather than either overwriting it or
      guessing at a sign-off this lane cannot obtain unattended -- the sign-off itself is the
      judgment the census names, and a policy default cannot manufacture one.

  - step_id: p3l.curation-prompt
    value: defer
    rationale: Decline strategic-self-description curation now; report Needs Attention.

  - step_id: p3x.memo-destination-offer
    value: "yes"
    rationale: >
      Default yes for classification (a)/(c) per census note; this lane always answers
      p1.repo-classification-ask as (a) working.

  - step_id: tw.windows-console-offer
    value: "install if tw.windows-console-signal-detect fires, else skip"
    rationale: The census's own stated default; evaluated without a confirmation round-trip.

  - step_id: tw.ci-offer
    value: "install if tw.ci-eligibility-resolve is true, else skip"
    rationale: Evaluated without a confirmation round-trip.

# --- AC5: ROSTER SLOTS. Ordered ready_to_fire baton slots; see CONTRACT.md § Roster slots for
# the ordering convention. This lane writes no baton -- slots are data naming the primitive.
roster_slots:
  - slot: 1
    title: "brownfield onboarding roster (C3 panel output)"
    pickup_ready_condition: immediate
    note: >
      Contents settled by state/audits/2026-08-20-brownfield-onboarding-roster.md (C3) -- this
      chunk names the slot shape only; which items fill it is C3's output, not authored here.

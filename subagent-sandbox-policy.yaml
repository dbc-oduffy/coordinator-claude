

# subagent-sandbox-policy.yaml
#
# Policy contract — the doctrine-owned half of the contract-vs-engine split.
#
# SCOPE: the write-sandbox confinement half is DEAD. The
# `confined:` / `exempt:` / `sanctioned_dirs:` deny grammar was removed
# end-to-end — this doctrine, the Python enforcement engine that reads it, and
# this file — and the pinned contract grammar table was dropped in lockstep.
# This file's surviving surface is `report_sidecar:` — the
# run-report-sidecar provisioning eligibility list — plus the additive
# `report_type_map:` key (agent-citizenship provisioning) layered on
# top of it; neither restructures the other.
#
# Read by:
#   (a) a PostToolUse hook (coordinator/hooks/scripts/enforce-agent-dispatch-mode.py),
#       which resolves a spawning subagent_type against report_sidecar: to decide
#       eligibility for an auto-provisioned run-report sidecar, and
#   (b) the provisioning engine's `provision_report` entrypoint.
# This key's name and value grammar are pinned against that engine's contract
# for the `report_sidecar` section. Any change to the key name or value
# grammar here is a breaking drift against that pinned contract and must be
# relayed to the engine side in lockstep — never silently changed.
#
#   report_sidecar:  list[str] of subagent_type values — the run-report-sidecar
#                     eligibility list. EXACT STRING MATCH — no globbing. Seeded with
#                     the write-capable / multi-step subagent classes; short read-only
#                     2-call spawns deliberately stay off it. A subagent_type present
#                     in this list is ELIGIBLE for an auto-provisioned run-report
#                     sidecar at spawn time; a subagent_type ABSENT is a lookup-miss,
#                     which fail-opens to "not eligible — provision nothing" (never a
#                     hard failure, never a blocked spawn). The provision engine (reader
#                     (b) above) emits either exactly one {"report_sidecar":"<path>"}
#                     line (eligible) or empty stdout (ineligible or any fail-open leg),
#                     exit 0 either way.
#
# Fail-open — an empty, absent, unreadable, or malformed policy resolves to an empty
# policy: every report_sidecar lookup then misses, and every spawn provisions nothing.
#



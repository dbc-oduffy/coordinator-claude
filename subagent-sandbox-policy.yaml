# bash_policy:  dict[str, dict] — subagent_type -> a mapping describing that
# subagent_type's allowed Bash surface. Sibling of report_sidecar: /
# report_type_map: / contract_blocks: above — same file, same exact-string
# subagent_type key convention, same fail-open-on-lookup-miss posture. EXACT
# STRING MATCH — no globbing. Consumed by the provisioning engine's own
# policy loader (its `Policy.bash_policy` field, added in lockstep) and,
# downstream, by the reviewer Bash guard. This key's name and value grammar
# are pinned against that engine's `bash_policy` contract — any
# change to the key name or value grammar here is a breaking drift against
# that pinned contract and must be relayed to the engine side in lockstep,
# exactly as report_sidecar:/contract_blocks: already require.
#
# Fail-open at the LOADER: an absent bash_policy: key, a non-dict top-level
# value, a non-dict per-key value, or a lookup-miss on a subagent_type not
# listed here all resolve to "no policy for this type" — never a parse
# failure, never a blocked spawn. This mirrors report_sidecar:'s fail-open
# contract exactly. The GUARD's miss-behaviour is the opposite of the
# loader's — a policy lookup-miss at the guard falls back to the guard's
# PRIOR hardcoded enforcement (AC11), never to ALLOW. These are two different
# layers with two different correct defaults: an eligibility lookup
# (report_sidecar:) degrading to "provision nothing" is harmless; a deny-
# guard's lookup degrading to "permit everything" is not. Do not conflate
# them when reading or extending this key.
#
# Two-class posture — read this before adding a row for a new subagent_type.
# There are exactly two classes of Bash surface in this fleet, not a spectrum:
# confined findings-agents (code-reviewer today, any future silent-corruption-
# risk peer tomorrow) get a row here and a real allowlist; every other
# subagent_type, executor included, is NOT a confined type and gets no row —
# not an empty one, not a wide-open one, none at all. A lookup-miss for a
# non-confined type is not a gap to be closed by adding a row "to be safe";
# it is the correct, intended state under the ruling that removed the
# executor carve-out from the confined set. If you are asking "should I add a
# row for type X," the question that actually gates it is "is X a confined
# findings-agent," not "does X run Bash" — most subagent_types that run Bash
# belong in the second class and stay off this key entirely.
#
# Generality (AC10): a second CONFINED subagent_type is a plain additional row
# under bash_policy: — no code change, no new top-level key, exactly the same
# extension shape report_sidecar:/report_type_map:/contract_blocks: already
# use. For example, adding a second confined findings-agent class would look
# like:
#
#   bash_policy:
#     coordinator:code-reviewer:
#       ...
#     coordinator:some-other-confined-agent:   # <- a plain additional row
#       ...
#
# This is documentation of the shape only — the empirical two-row proof
# (a fixture policy carrying two bash_policy rows for two distinct
# subagent_type keys, each resolving independently with no cross-leak) lives
# in the provisioning engine's own loader test, not here — a
# header-comment-only demonstration is unfalsifiable.
#
# --- Negative spec: Bash ONLY, no write/edit leg, ever ---
#
# `bash_policy:` governs the Bash tool surface for a confined subagent_type.
# It MUST NEVER carry a Write/Edit/MultiEdit-shaped grammar — no `deny:`,
# `write:`, `edit:`, `sanctioned_dirs:`, `confined:`, or `exempt:` key at any
# depth under any subagent_type row. That is not a stylistic preference; it
# is a deliberate, PM-directed ruling that REMOVED exactly this grammar — the
# `confined:`/`exempt:`/`sanctioned_dirs:` deny keys this file used to carry
# governed Write/Edit, not Bash, and were killed end-to-end (the doctrine
# side, the enforcement engine, and this file's own keys) because the
# confinement overrode the EM's own dispatch intent for no measurable safety
# gain: a doctrine-sweep worker blocked mid-task by a hook the task text
# could not override, with no corresponding incident it had actually
# prevented. The revisit trigger for that ruling is narrow and has NOT
# fired: reopening a write/edit leg requires a CONCRETE incident where a
# reviewer (or other confined agent) silently corrupted source that the EM's
# own `git diff` review missed — i.e. a case where the confinement would
# have prevented real harm, not merely friction. Even if that trigger fires,
# the ruling itself scopes any reintroduction to the reviewer class ONLY
# (never `general-purpose`/`executor`) and forbids it from ever blocking a
# write the EM explicitly delegated. Until that trigger fires, adding a
# write/edit leg here is not a local editorial call — it is a doctrine
# reversal, and the ruling stays in force regardless of how inconvenient its
# absence feels to a future session.
#
# Two further points govern *why* this negative-spec is legible as a rule
# rather than a bare assertion, and *why* this file — not the engine that
# reads it — is the correct place to enforce it:
#
#   The general doctrine↔engine file-of-authority rule holds here:
#   doctrine owns the rules, the engine owns the machine that honors them.
#   `bash_policy:`'s declared grammar (this YAML) is contract/data and
#   belongs in doctrine; the engine that reads and enforces it (the
#   provisioning engine's policy loader, and the reviewer Bash guard's
#   consumption of it) is machine and belongs on the engine side. The split
#   across the two sides for this same feature is a direct instance of that
#   cut, not an arbitrary one.
#
#   The general doctrine-reversal discipline also holds: a settled ruling is
#   legitimately reversed only by naming a genuinely NEW fact its original
#   deciders did not have, never by restating a disagreement they already
#   considered and decided anyway. It is what makes "adding a write/edit leg
#   here would not reverse the ruling above without new evidence" a
#   checkable rule instead of an assertion a future editor can talk
#   themselves past — the concrete incident named above is exactly the kind
#   of new fact required before that ruling may be reopened.
#
# Gate: this comment states the WHY; coordinator/tests/test_bash_policy_no_write_leg.py
# is the WHETHER — it asserts both that this file's bash_policy: subtree
# carries no write/edit-shaped key at any depth, and that the engine's
# policy class exposes no such field. A future session that adds a
# `deny:`/`write:`/`edit:`/`sanctioned_dirs:`/`confined:`/`exempt:` key here
# specifically because it wants to route around this comment will fail that
# test, not just read past this prose.
#
  # atlassian-worker / drive-worker: SUPERSEDED 2026-07-30 (dispatch-tiering, Leg
  # B), then amended same-day (code-reviewer finding #2). Both used to be
  # report_sidecar-eligible (assessment-typed) and carried the universal
  # precedence block as their only contract text, since no family shape block
  # applied to these read-only MCP workers. Both are now exploration tier (see
  # dispatch_tier: above) and absent from report_sidecar: — no sidecar is
  # provisioned, so neither carries provisioned-scaffold-precedence or any
  # other sidecar-family block any more. Their contract_blocks rows were not
  # left empty, though: both still carry quota-self-detect-preamble (see that
  # row, above, in the contract_blocks: section) — that block is tier-
  # agnostic and applies to these two MCP-heavy retrieval workers regardless.
# DECLARED KEYS ARE LOAD-BEARING; DECLARED RULESETS ARE NOT. Editing a
# ruleset under a row here changes no enforced ALLOW/DENY. The engine
# resolves a confined type's allowed Bash surface entirely in Python:
# `_resolve_ruleset` in claude-klabauter
# `coordinator_core/bash_guards/block_reviewer_bash_outside_allowlist.py`
# terminates unconditionally in `_default_ruleset(effective_type)` +
# `_DEFAULT_RULESET_TYPE_OVERRIDES` and does not read this table at all
# (Divergence 14) — a confined reviewer holds an unconfined `Edit` that
# reaches this file, so a policy-driven confinement was rewritable by the
# very agent it confines.
#
# What a row here still does: `_is_confined_type` consults this table for
# exact-key SET MEMBERSHIP, so a confined type must remain a key whose value
# is a mapping — `engine.load_policy` silently drops any non-dict-valued
# entry. That is the whole live contract of this section.
#
# The transcribed reviewer ruleset that used to sit here was removed once it
# had drifted from the enforced one with nothing failing — nothing read it.
# Do not re-transcribe one: a second copy of the allowlist is a trap, not
# documentation. Read the Python.
#
# Bash only. No Write/Edit/MultiEdit surface is or was ever expressed here —
# see the negative-spec block above, gated by
# coordinator/tests/test_bash_policy_no_write_leg.py.
bash_policy:
  coordinator:code-reviewer:
    declaration_only: true

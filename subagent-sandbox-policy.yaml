# coordinator:drive-worker were removed from this list — dispatch_tier: (below)
# classifies both as exploration tier (write-toolless, clause (1)), so neither is
# provisioning-eligible any more. coordinator:security-audit-worker and
# coordinator:external-pattern-checker were considered for the same removal and
# corrected back to review-execution tier (see dispatch_tier:'s own comment) — both
# stay on this list. coordinator:dep-cve-auditor and coordinator:test-evidence-parser
# were ALSO removed in that same pass and then restored here (2026-07-30, same-day
# fix): the two-clause rule as shipped dropped the payload-size discriminator, and
# both agents' own bodies hard-require a sidecar (see dispatch_tier:'s clause (2)(c)
# comment) — removing them left their own contract unfulfillable at every dispatch.
# Removal (for atlassian-worker/drive-worker) is safe by this file's own fail-open
# contract: an absent subagent_type is a lookup-miss that resolves to "provision
# nothing", never a hard failure or a blocked spawn.

# report_type_map:  dict[str, str] — subagent_type -> template type, additive
# on top of report_sidecar (does NOT replace or restructure it). Selects which
# of the provisioning engine's four `provision_report --type` templates
# (run-report / review-findings / assessment / staff-eng-review) an eligible
# subagent_type's auto-provisioned sidecar should use.
#
# TWO consumers, not one:
#   (a) a doctrine-side hook, on the `Agent`-tool spawn path; and
#   (b) the engine's `subagent_sandbox.engine.load_policy`, which parses this
#       key so `provision-sidecar` resolves the same template on the Workflow
#       path (where no `Agent`-tool hook fires).
# What (b) depends on is the KEY NAME and the `str -> str` value grammar,
# nothing more — rows may be added, removed, or re-pointed freely without
# engine-side coordination. Parsing there is fail-open at both levels (a
# non-dict value voids the map, a malformed row drops only itself, a
# lookup-miss provisions the legacy shape). Renaming the key, or changing its
# value grammar away from `str -> str`, breaks that consumer and needs the
# lockstep relay this file's header requires. Every key here MUST also be report_sidecar-eligible
# (see coordinator/tests/test_report_type_map.py) — a subagent_type cannot
# get a typed sidecar unless it can get a sidecar at all. Every subagent_type
# declared across coordinator/agents/*.md MUST appear here (no agent left
# unmapped) — the test enumerates coordinator/agents/*.md `name:` frontmatter
# and cross-checks.

# dispatch_tier:  dict[str, str] — subagent_type -> "exploration" | "review-execution".
# Additive on top of report_sidecar: / report_type_map: / contract_blocks: — does not
# restructure any of them. Every subagent_type declared across coordinator/agents/*.md
# MUST appear here exactly once (coverage + closed-value-set + the structural clause-1
# check below are all asserted by coordinator/tests/test_dispatch_tier.py).
#
# THE RULE (mechanical — apply it, don't re-litigate it case-by-case):
#
# A sidecar buys two different things — crash/compaction protection (redoing lost
# work costs more than the boot) and EM-context protection (an inline return would
# spend more of the dispatching EM's context window than the sidecar convention
# saves). A surface needs only ONE of the two to earn a sidecar, not both.
#
# A surface is REVIEW-EXECUTION tier (sidecar provisioned) only if it satisfies BOTH:
#   (1) It can fill one. It holds a write tool (Write/Edit). An agent without one can
#       never author its sidecar, so it can never be review-execution tier — this leg
#       is mechanical and admits no exception.
#   (2) Losing the run, or returning it inline, costs more than the boot. Its output
#       is ANY of:
#         (a) TRANSPORT — consumed by another agent downstream rather than by the
#             dispatching EM;
#         (b) ACCUMULATED across more than one independent unit of work (chunk, file,
#             source, link, package), such that a mid-run crash or compaction means
#             redoing work already finished; or
#         (c) LARGE OR UNBOUNDED PAYLOAD — its output is a table/list/report whose
#             size scales with the input (findings across N packages, N test
#             failures) rather than a small fixed-size answer (a verdict, a short
#             list, a pointer), such that returning it inline costs the dispatching
#             EM more context than the sidecar convention saves. "Returns a table" is
#             not itself the test — a short, bounded table is exploration-tier;
#             unbounded-with-input-size is what makes (c) fire.
#
# Everything else is EXPLORATION tier: findings come back inline in the final message
# and no sidecar is provisioned. The saving is real — a doctrine-carrying dispatch
# boots at ~45-55k against Explore's ~17.6k — but note the honest constraint: the
# cheap harness tier (Explore/Plan) has no Edit/Write at all, so "exploration tier"
# here means "needs no sidecar", not "is automatically re-pointed at Explore".
#
# report_sidecar: stays the PROVISIONING TRIGGER (fail-open lookup-miss = "provision
# nothing"). Every review-execution-tier row here is report_sidecar-eligible; every
# exploration-tier row here is absent from report_sidecar: — dispatch_tier: makes that
# classification an explicit, checked artifact instead of something inferable only
# from report_sidecar:'s membership. coordinator/tests/test_dispatch_tier.py enforces
# clause (1) structurally: no agent lacking a write tool may be review-execution, and
# no exploration-tier agent may appear in report_sidecar:.
#
# Applying clause (2): two agents fail clause (1) alone (no write tool at all) —
# coordinator:atlassian-worker, coordinator:drive-worker. The rest are write-capable,
# so clause (2) decides them. TRANSPORT is read off actual downstream wiring, not
# guessed: docs-checker/prior-art-checker/plan-coverage-checker all have a dedicated
# "-consumption" block injected into the six G1 reviewer personas (they read these
# sidecars as part of their own dispatch contract); external-pattern-checker is the
# same transport case — its sidecar is consumed downstream by an Opus review, the
# direct sibling of prior-art-checker's pre-flight-recall-into-Opus-review shape, and
# its bounded web research is expensive to redo, so splitting it from prior-art-checker
# would be incoherent; the deep-research scout/specialist/sweep chain (repo-scout,
# repo-specialist, research-scout, research-specialist, research-worker,
# notebooklm-research-scout) hands off via an explicit, prompt-documented file
# convention each downstream teammate reads on startup; the six review personas and
# the G4 execute-pipeline pair (executor, review-integrator, plus enricher upstream of
# it) are transport/accumulated by construction. ACCUMULATED covers doc-link-checker
# (up to 100 sequential network link-checks per dispatch), code-reviewer/
# code-reviewer-weekly/parallel-review-synthesizer/coverage-auditor (chunked review —
# crash-safety is the whole point), security-audit-worker (it scans a diff,
# accumulating findings file by file — a crash midway through a large diff loses every
# finding already made; the unit count scales with the diff's size, not with a fixed
# per-agent call budget, so "a handful of bounded tool calls" is the wrong measure for
# it), and the sweep/synthesizer stage (research-sweep, research-synthesizer,
# structured-synthesizer — merges N upstream specialists' work, expensive to redo).
# dep-cve-auditor and test-evidence-parser fail BOTH transport ((a) — no consumption
# block wired to any downstream agent's own prompt; the EM is the sole direct reader)
# and accumulation ((b) — each is a single fast local pass, cheap to rerun in full,
# not the many-independent-unit exposure that leg requires), but both hit clause
# (2)(c): their own agent bodies hard-require a sidecar (test-evidence-parser
# pre-scaffolds a findings file and makes exactly one Edit replacing a
# `<!-- FINDINGS -->` sentinel; dep-cve-auditor's Edit "fails loudly if the sidecar is
# absent — correct behavior", and an inline summary is "task failure, not a
# shortcut") and their payload — a triage table across N test failures, or a CVE
# table across ecosystems — scales with the input rather than being a small
# fixed-size answer, so returning it inline spends exactly the EM context the
# sidecar convention exists to avoid.
dispatch_tier:
  coordinator:executor: review-execution
  coordinator:review-integrator: review-execution
  coordinator:enricher: review-execution
  coordinator:code-reviewer: review-execution
  coordinator:code-reviewer-weekly: review-execution
  coordinator:coverage-auditor: review-execution
  coordinator:parallel-review-synthesizer: review-execution
  coordinator:staff-eng: review-execution
  coordinator:staff-data-sci: review-execution
  coordinator:senior-front-end: review-execution
  coordinator:staff-ux: review-execution
  coordinator:vp-product: review-execution
  coordinator:eng-director: review-execution
  coordinator:docs-checker: review-execution
  coordinator:doc-link-checker: review-execution
  coordinator:plan-coverage-checker: review-execution
  coordinator:prior-art-checker: review-execution
  coordinator:repo-scout: review-execution
  coordinator:repo-specialist: review-execution
  coordinator:research-scout: review-execution
  coordinator:research-specialist: review-execution
  coordinator:research-sweep: review-execution
  coordinator:research-synthesizer: review-execution
  coordinator:research-worker: review-execution
  coordinator:notebooklm-research-scout: review-execution
  coordinator:structured-synthesizer: review-execution
  coordinator:security-audit-worker: review-execution
  coordinator:external-pattern-checker: review-execution
  coordinator:atlassian-worker: exploration
  coordinator:drive-worker: exploration
  coordinator:test-evidence-parser: review-execution
  # test-runner executes; its report is the payload test-evidence-parser reads, so the
  # same clause (2)(c) payload-size/EM-context rationale that tiers the parser applies.
  coordinator:test-runner: review-execution
  coordinator:dep-cve-auditor: review-execution
  # no Write/Edit — clause (1) forces exploration tier, same as atlassian-worker/drive-worker
  coordinator:git-commit-agent: exploration
  # Holds Edit, so clause (1) passes. Clause (2)(c): its body hard-requires the
  # pre-provisioned sidecar (Edit only — "never `Write` a new file, never guess a
  # path") and its return is a bare `DONE: <sidecar-path> — <verdict>`, so the whole
  # verdict payload — one bullet per finding across three lenses, scaling with the
  # page — exists only in the sidecar. Same shape as dep-cve-auditor/
  # test-evidence-parser: exploration tier would make its own contract
  # unfulfillable at every dispatch. Not (a)/(b): one page per dispatch, EM-read.
  coordinator:atlas-clarity-reviewer: review-execution

# contract_blocks:  dict[str, list[str]] — subagent_type -> ORDERED list of
# canonical snippet block names to assemble and inject into that subagent's
# dispatch prompt at spawn time. Additive on top of report_sidecar:; every key
# here MUST name a REAL agent declared under coordinator/agents/*.md (see
# coordinator/tests/test_contract_blocks.py) — it is NOT required to be
# report_sidecar-eligible. Decoupled 2026-07-30 (dispatch-tiering, Leg B), same
# shape as report_type_map:'s own decoupling above: a block that teaches an
# agent about a provisioned sidecar (provisioned-scaffold-precedence,
# sidecar-emission-contract, sidecar-frontmatter-contract, run-report-
# citizenship) belongs only to a report_sidecar-eligible agent, but a block
# like quota-self-detect-preamble teaches an agent to notice its own quota
# exhaustion regardless of tier — forcing contract_blocks: keys to equal
# report_sidecar: would strip that protocol from every exploration-tier agent
# purely to keep the two lists in lockstep, which is exactly the coupling
# defect this decoupling closes. Block names are registry.toml snippet names
# WITHOUT the .md suffix and MUST resolve to a real coordinator/snippets/
# <name>.md on disk. List ORDER is the emission order — deterministic,
# asserted by test. A subagent_type absent from this map receives no
# injection (lookup-miss fail-open, never a blocked spawn). An EMPTY list is
# legal and means the same. This key's name and value grammar are pinned
# against the provisioning engine's own `contract_blocks` contract — lockstep,
# never one-sided.
#
# Artifact-type families (report_type_map: shape, not persona identity) —
# three exist as of 2026-07-26: `review-findings`/`staff-eng-review`-shaped
# rows get sidecar-frontmatter-contract (G1); `assessment`-shaped G2
# pre-flight rows get sidecar-emission-contract; `run-report`-shaped rows
# (executor, review-integrator) get run-report-citizenship. These are three
# genuinely different sidecar shapes (see run-report-citizenship.md's own
# header for the discriminating detail) — never force one onto a
# subagent_type whose deliverable shape doesn't match; an agent that never
# runs a pre-flight does not carry pre-flight-consumption prose, and an
# `assessment`-shaped worker outside the G2 plan-pipeline does not carry the
# G2-specific plan-sidecars path convention (see the G5 rows' own comment
# below for a concrete instance of that discrimination).
#
# G1 (reviewer-persona shared contract) rows: the six named Opus-tier reviewer
# personas. DEFAULT-TO-ALL-TO-ALL (seam adjudication / G1 C2, F9 the Director of Engineering): the
# universal-safe blocks — persona-dispatch-contract (front of the ordered
# list — defines the base ReviewOutput envelope every persona-specific delta
# extends, so it must resolve before them), reviewer-calibration,
# quota-self-detect-preamble, sidecar-frontmatter-contract, the pre-flight
# trio (docs-checker-consumption, prior-art-check-consumption,
# plan-coverage-check-consumption; inert when a persona never receives that
# pre-flight sidecar), and persona-persisting-findings (persist-to-disk
# mechanics, positioned last as a downstream-of-sidecar-path concern) —
# default to all six. reviewer-calibration is the one block excluded
# per-persona, and ONLY where a STATED behavioral reason exists (burden of
# argument sits on the exclusion, not the inclusion): staff-ux (the UX Reviewer) runs a
# flow/step-based finding shape, not the fix-vs-ask rubric; vp-product (the VP-Product Reviewer)
# runs a product-lens voice, not the fix-vs-ask rubric. Both personas would
# be behaviorally misled by the rubric's fix-vs-ask framing, so it is
# omitted for them; the other four personas (staff-eng, eng-director,
# staff-data-sci, senior-front-end) receive it. do-not-commit.md and
# guard-encounter-preamble are NOT injected — they stay RESIDENT (pasted)
# per C1/F3 and are not contract_blocks entries, for these six or for any
# subagent_type in any family below — that carve-out is universal, not
# G1-scoped.
#
# 2026-07-26 regression note (G0 leg (b)): persona-dispatch-contract and
# persona-persisting-findings were added to the six G1 rows above to close a
# live committed regression — commit 909cc10b (G1 second pass) converted all
# six personas' pasted blocks to prose references pointing at "the injected
# X block", but the corresponding contract_blocks/registry.toml wiring never
# landed in that commit. Between 909cc10b and this fix, dispatching any of
# the six personas delivered NEITHER the old resident paste (removed) NOR the
# new injected content (not yet wired) — a silent content-loss window, not a
# duplication one. See state/subagent-share/g1-second-pass/
# contract-block-requests.md for the diff-intent this closes.
#
# G2 (plan-pipeline sidecar contract) rows: the four pre-flight sidecar-
# emitters get the single sidecar-emission-contract block (their own path/
# frontmatter/verdict-floor/return-a-pointer contract — distinct from the
# reviewer-persona sidecar-frontmatter-contract above).
#
# G3/G4/G5 rows (2026-07-26, G0 leg (b) citizenship extension): see the
# per-block-group comments directly above each group of rows below for the
# specific reasoning (universal-safe quota-self-detect-preamble win, the new
# run-report-citizenship family for G4, and the deliberate G5 sidecar-
# emission-contract non-adoption).
#
# The transient-duplication note that used to sit here — "the newly-cited
# blocks are, for now, ALSO still resident-pasted... a follow-up pass must
# strip the resident copies" — is RESOLVED as of 2026-07-28. The strip landed
# (909cc10b and successors); zero of the in-repo consumers for
# persona-dispatch-contract, persona-persisting-findings, or
# quota-self-detect-preamble carry a resident sentinel. Those three registry
# rows were flipped paste -> inject to match, because while they still read
# "paste" a single `verify-snippet-sync <row> --fix` would have re-inserted
# 37 blocks into files the strip had already cleaned. Do not restore this note
# as a live caveat: it read as current long after it stopped being true, which
# is exactly how the stale declaration survived.

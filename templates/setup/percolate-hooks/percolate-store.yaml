  coordinator-claude-publish-repo-toplevel:
    hooks:
      - path-rewrite
      - substitute
      - stem-rewrite
      - depersonalize
      - basename-rename
      - inject
      - guard
    file_surface:
      # exclude_prefixes REPLACES (not unions with) base's list -- shallow-merge
      
      
      exclude_prefixes:
        - ".claude-plugin"
        - ".git"
        - ".github"
        - "agents"
        - "bin"
        - "commands"
        - "docs"
        - "hooks"
        - "lib"
        - "skills"
    
    
    # The mirror's own local validation harness (run-all-checks.py and the checkers it
    # drives, allowlists, issue/PR templates; no workflows). Homed at
    # dist/mirror-native/coordinator-claude/.github/ after a clean-slate mirror
    # rebuild (2026-08-05) found it existing ONLY in the publish repo, authored
    # nowhere in source -- the mirror could not be reconstructed from this tree,
    # and wiping it took the end-of-run identity gate's own checker with it.
    # Direct precedent: claude-klabauter's claude-klabauter block
    # (setup/percolate-hooks/percolate-store.yaml:1203-1242), same failure mode,
    # same resolution.
    #
    # THIS ROW, not the `coordinator-claude` mirror row: inject resolves `dst`
    # against `target.dest_dir` (= dest_root/dest_subdir). (Review: code-reviewer,
    # 2026-08-05 -- corrected a false uniqueness claim here: this row and the
    # `coordinator-claude` row both carry an empty `dest_subdir` in
    # setup/publish-targets.portable, so both resolve `dst` to the mirror repo
    # ROOT -- this row is not unique in that respect.) The actual reason this
    # row hosts the `.github` inject rather than `coordinator-claude`: this
    # section (`-publish-repo-toplevel`) owns the publish repo's TOP-LEVEL
    # directory furniture (README, CI harness, issue/PR templates -- § this
    # section's own header comment), a distinct content domain from
    # `coordinator-claude`'s job of mirroring the plugin's own machinery
    # (bin/lib/agents/skills/etc. from `plugin-source:coordinator-claude`).
    # `.github`'s CI harness belongs with the repo-toplevel content it
    # governs, not the plugin-content mirror, even though both rows' `dst`
    # happen to coincide at the mirror repo root.
    #
    # `inject` rather than a publish row is structural, not preference: inject
    # dispatches AFTER the content-transform sweep, so check-persona-names.py's
    # BANNED vocabulary -- literal fleet codenames, by construction -- is not
    # itself rewritten into placeholders, which would leave the checker reporting
    # green over a dirty tree. This target's own `exclude_prefixes` above already
    # carries `.github` for the same reason, as does base's `exclude_basenames`
    # (check-persona-names.py) and `exclude_globs` (*check-persona*).
    #
    # Survives this row's own flat-mirror sweep: Phase 2 deletes top-level FILES
    # only, never directories (setup/publish_sync.py:877), so an injected
    # `.github/` is not reaped between passes.
    
    
    inject:
      - src: "<coordinator-content-root>/dist/mirror-native/coordinator-claude/.github"
        dst: ".github"
        required_children:
          - "scripts/run-all-checks.py"
          - "scripts/check-persona-names.py"
    guards:
      
      
      - kind: "prune-stale-paths"
        params:
          paths:
            - "archive/handoffs"
            - "tasks/handoffs"
      
      
      - kind: "no-residual-pattern"
        params:
          pattern_source:
            registry_codenames: true
            form: "alternation"
          include_extensions:
            - "*.md"
            - "*.sh"
            - "*.py"
            - "*.json"
            - "*.ts"
            - "*.toml"
            - "*.js"
            - "*.mjs"
            - "*.ps1"
            - "*.cmd"

  

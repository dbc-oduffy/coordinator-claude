# percolate-store.yaml -- production DoE percolate-store (FINISH_OP migration).


# doe-store.yaml is a REPRESENTATIVE SLICE used only by that repo's own parity


#     oracle-verified during BIG_PORT; do not hand-edit values here without


#     substitute table, PATH_REWRITE_SOURCES/DESTS, EXCLUDED_PREFIXES.


schema_version: "1.0.0"

base:

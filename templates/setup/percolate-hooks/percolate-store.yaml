    # coordinator/templates/machine-local/registry.toml.example: the HTML-comment
    # form above is not valid TOML syntax, so a TOML source file needs its own
    # marker form. It fences the file's two `repos.claude_klabauter` rows (root
    # table + `[regeneratability]`) -- DoE-plane-only, engine-source-working-tree
    # rows with no OSS meaning. Without this, the depersonalize table's
    # claude_klabauter -> claude_klabauter rewrite (below) collapses each fenced row
    # onto its `repos.claude_klabauter` sibling, producing a DUPLICATE KEY --
    # invalid TOML -- on every publish (the `[regeneratability]` pair additionally
    # disagreeing in value: session-accumulated-must-survive-crash vs
    # idempotent-regeneratable). Stripping removes the row instead of renaming it,
    # keeping the projection injective, regardless of pass order: stripping
    # deletes the whole fenced region outright, so the row never reaches the
    # projection whether or not depersonalize has already renamed it first.
    
    
    sentinel_strip:
      - start_marker: ""
      - start_marker: ""
      - start_marker: ""
    inject:
      
      
      - src: "<coordinator-content-root>/dist/oss-only-skills/coordinator-update"
        dst: "skills/coordinator-update"
        required_children:
          - "SKILL.md"
      
      
    guards:
      
      
      - kind: "source-dir-absent"
        params:
          path: "game-dev"
        override_env: "COORDINATOR_OVERRIDE_GAMEDEV_GUARD"
      
      
      - kind: "dirs-present"
        params:
          paths:
            - ".claude-plugin/plugin.json"
      # RESOLVED 2026-08-01 (C5): AC2a/AC2b/AC2c (forbidden-script-globs,
      
      
      # RESOLVED 2026-08-01 (C5, second pass): AC3 (`dirs-absent` over
      
      
      # MANIFEST, so shipping `hooks/scripts/` without it would publish an
      
      
      - kind: "dirs-present"
        params:
          paths:
            - "skills"
            - "agents"
            - "commands"
            - "skills/new-project/templates/next-app/src/lib"
      
      
      - kind: "no-residual-pattern"
        params:
          pattern_source:
            registry_codenames: true
            form: "alternation"
          include_extensions:
            - "*.md"
            - "*.sh"
            - "*.py"
            - "*.json"
            - "*.ts"
            - "*.toml"
            - "*.js"
            - "*.mjs"
            - "*.ps1"
            - "*.cmd"
      
      
      # Bare-codename backstop (identity-gate-asymmetry, state/research/
      # 2026-09-09-identity-gate-asymmetry.md § 2). `_registry_alternation_
      # pattern` (claude-klabauter coordinator_core/ops/percolate_run.py)
      # builds the guard above from `repos.*` machine-local registry-key
      # SPELLINGS only (`claude_klabauter`/`claude-klabauter`), so it compiles
      # `claude_klabauter|project\-claude-klabauter|...` and structurally cannot match
      # the bare token `claude-klabauter` -- there is no `repos.*` key spelled that
      # way to derive it from. That blind spot is why the six-path leak this
      # entry answers survived every prior publish undetected. `params.
      # pattern` (a static literal, same schema-supported alternative the
      # gendered-pronoun entry below already uses) closes it directly for
      # this one already-known private codename, per depersonalize-
      # doctrine.md's "seed the bare token explicitly" prescription for any
      # `repos.*`-registry-unspellable codename (`example-initiative`, `example-workstream`
      # already carry the same shape in `depersonalize:` above). Word-
      # boundary anchored, case-insensitive, so it also catches `Claude-Klabauter`/
      # `CLAUDE-KLABAUTER` residue the same way the depersonalize entry's own
      # `case_variants` does. Not a substitute for porting klabauter's
      # literal `BANNED`-list path scan as a second independent leg (R2's
      # "better still") -- that is a larger, separate change, left for a
      # follow-up plan rather than folded into this fix.
      
      
      - kind: "no-residual-pattern"
        params:
          pattern: '(?i)\bclaude-klabauter\b'
          include_extensions:
            - "*.md"
            - "*.sh"
            - "*.py"
            - "*.json"
            - "*.ts"
            - "*.toml"
            - "*.js"
            - "*.mjs"
            - "*.ps1"
            - "*.cmd"
      
      
      # own `GENDERED_PRONOUN` pattern verbatim (source-side gate); this is the same
      
      
      # widening ever needs a DIFFERENT extension set than `file_surface`'s own,
      
      
      - kind: "no-residual-pattern"
        params:
          pattern: '(?i)\b(he|him|his|she|her|hers|himself|herself)\b|he\s+or\s+she|\(s\)he|\bs/he\b'
          include_extensions:
            - "*.md"

  

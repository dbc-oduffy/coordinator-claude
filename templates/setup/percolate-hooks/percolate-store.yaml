targets:
  
  
  coordinator-claude:
    hooks:
      - path-rewrite
      - substitute
      - stem-rewrite
      - depersonalize
      - sentinel-strip
      - basename-rename
      - inject
      - guard
    
    
    # onto its `repos.claude_klabauter` sibling, producing a DUPLICATE KEY --
    
    
    sentinel_strip:
      - start_marker: ""
      - start_marker: ""
      - start_marker: ""
    inject:
      
      
      - src: "<coordinator-content-root>/dist/oss-only-skills/coordinator-update"
        dst: "skills/coordinator-update"
        required_children:
          - "SKILL.md"
      
      
    guards:
      
      
      - kind: "source-dir-absent"
        params:
          path: "game-dev"
        override_env: "COORDINATOR_OVERRIDE_GAMEDEV_GUARD"
      
      
      - kind: "dirs-present"
        params:
          paths:
            - ".claude-plugin/plugin.json"
      # RESOLVED 2026-08-01 (C5): AC2a/AC2b/AC2c (forbidden-script-globs,
      
      
      # RESOLVED 2026-08-01 (C5, second pass): AC3 (`dirs-absent` over
      
      
      # MANIFEST, so shipping `hooks/scripts/` without it would publish an
      
      
      - kind: "dirs-present"
        params:
          paths:
            - "skills"
            - "agents"
            - "commands"
            - "skills/new-project/templates/next-app/src/lib"
      
      
      - kind: "no-residual-pattern"
        params:
          pattern_source:
            registry_codenames: true
            form: "alternation"
          include_extensions:
            - "*.md"
            - "*.sh"
            - "*.py"
            - "*.json"
            - "*.ts"
            - "*.toml"
            - "*.js"
            - "*.mjs"
            - "*.ps1"
            - "*.cmd"
      
      
      # SPELLINGS only (`claude_klabauter`/`claude-klabauter`), so it compiles
      
      
      - kind: "no-residual-pattern"
        params:
          pattern: '(?i)\bclaude-klabauter\b'
          include_extensions:
            - "*.md"
            - "*.sh"
            - "*.py"
            - "*.json"
            - "*.ts"
            - "*.toml"
            - "*.js"
            - "*.mjs"
            - "*.ps1"
            - "*.cmd"
      
      
      # own `GENDERED_PRONOUN` pattern verbatim (source-side gate); this is the same
      
      
      # widening ever needs a DIFFERENT extension set than `file_surface`'s own,
      
      
      - kind: "no-residual-pattern"
        params:
          pattern: '(?i)\b(he|him|his|she|her|hers|himself|herself)\b|he\s+or\s+she|\(s\)he|\bs/he\b'
          include_extensions:
            - "*.md"

  

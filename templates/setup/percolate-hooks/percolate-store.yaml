    - path-rewrite
    - substitute
    - stem-rewrite
    - depersonalize
    - basename-rename
    - file-surface

  
  # its extensionless-shebang sniff (line ~500-517) and EXCLUDED_PREFIXES /
  # EXCLUDED_BASENAMES (lines ~461-473).
  
  # Translation caveat: EXCLUDED_PREFIXES in the bash oracle are TWO-SEGMENT,
  
  
  # matches_exclude_prefix) matches by SEGMENT-EXACT anywhere in the relative
  
  
  file_surface:
    include_extensions:
      - "*.md"
      - "*.sh"
      - "*.py"
      - "*.json"
      - "*.ts"
      - "*.toml"
      - "*.js"
      - "*.mjs"
      - "*.ps1"
      - "*.cmd"
    shebang_prefixes:
      - "#!"
    exclude_prefixes:
      - "archive"
      - "tasks"
      - "experiments"
      - "evals"
      - "plans"
      - "research"
      - "decisions"
      - "specs"
    exclude_basenames:
      - "publish-time-transform.sh"
      - "check-persona-names.py"
      
      
      - "depersonalize.py"
      - "test_depersonalize.py"
    
    
    exclude_globs: []

  # Mirrors PATH_REWRITE_SOURCES / PATH_REWRITE_DESTS (publish-time-transform.sh
  
  
  path_rewrite:

    # asymmetry.md): the four entries above never covered the `coordinator/
    # bin,lib` executable surface routed into the coordinator-claude target
    # via source_map (d4a566c99 widened that row to publish bin/lib/hooks as
    # a real executable surface; this table was not extended to match), so
    # six paths kept shipping the private fleet codename `claude-klabauter` in their
    # FILENAMES to the public mirror even though their CONTENT was already
    # scrubbed by the bare `claude-klabauter` depersonalize entry above -- a half-
    # completed rename, not merely a leak: the published files' own
    # docstrings/usage text already name the NEW basenames below (e.g.
    # `gen-claude-klabauter-root-pointer.py` line 1 reads
    # "gen-claude-klabauter-root-pointer.py"), so without this the shipped
    # launcher invoked a sibling file that does not exist. Directory rename
    # (trailing slash on both sides, per `_partition_rename_pairs`'s
    # src/dst-both-or-neither convention) mirrors `coordinator_core/install/
    # substrate.py`'s own documented expectation (~line 1040: "percolate's
    # rename map rewrites it on publish (resolve-claude-klabauter/_resolve_claude_klabauter.py
    # -> resolve-claude-klabauter/_resolve_claude_klabauter.py)") -- matched
    # to that literal target basename, not invented here. `.cmd` siblings
    # keep their `.cmd` extension (the Windows-launcher counterpart of a
    # `.sh`/`.py` script, never renamed to `.sh` the way the pre-existing
    # `check-claude-klabauter-doctor-sentinel.sh` -> `...-sentinel.sh` entry above
    # does for its own `.py`).
    
    
    - src: "resolve-claude-klabauter/"
      dst: "resolve-claude-klabauter/"
    - src: "_resolve_claude_klabauter.py"
      dst: "_resolve_claude_klabauter.py"
    - src: "check-claude-klabauter-doctor-sentinel.cmd"
      dst: "check-claude-klabauter-doctor-sentinel.cmd"
    - src: "gen-claude-klabauter-root-pointer.py"

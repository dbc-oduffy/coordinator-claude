# percolate-store.yaml -- production DoE percolate-store (FINISH_OP migration).
#
# This is the DoE-owned production deliverable claude-klabauter's percolation engine
# (claude-klabauter/coordinator_core/percolate/) consumes via the `percolate.run`
# op. It replaces the CONTENT of 11 of the 15 `.sh` scripts under
# coordinator/templates/setup/percolate-hooks/ (the transform-kind data those
# scripts hand-executed is now declarative store data; the scripts themselves
# either become thin `percolate.run` trampolines or are deleted outright --
# that decision is the publish-driver's, out of scope for this store).
#
# NOT the test fixture. Claude-klabauter/coordinator_core/percolate/tests/fixtures/
# doe-store.yaml is a REPRESENTATIVE SLICE used only by that repo's own parity
# test; this file is the full, load-bearing production table.
#
# Spec backlinks:
#   - DoE-claude tasks/2026-07-16-clean-slate-recon/finish-op-percolate-recipe.md
#     (composition rules, hook taxonomy, per-hook migration recipe -- READ FIRST)
#   - claude-klabauter coordinator_core/frontmatter/schemas/percolate-store.schema.json
#     (shape this file validates against)
#   - claude-klabauter coordinator_core/percolate/codename_provenance_seed.py
#     (byte-for-byte source of the depersonalize/basename_rename tables below --
#     oracle-verified during BIG_PORT; do not hand-edit values here without
#     re-syncing that module)
#   - coordinator/bin/publish-time-transform.sh (RETIRED — deleted from this
#     repo by the percolate-python-port cutover; was the source of the persona
#     substitute table, PATH_REWRITE_SOURCES/DESTS, EXCLUDED_PREFIXES.
#     Review: code-reviewer — confirmed 404 on disk; kept as a historical
#     citation for the tables below, which were derived from it before
#     retirement, not as a claim the file still exists.)
#
# C-W3 disposition (docs/plans/2026-07-21-percolate-python-port.md) of the 7
# hook-behaviors originally deferred as non-declarative: 5 are now wired IN
# THIS STORE against claude-klabauter's shipped engine primitives (ec766767) --
# create-if-absent inject (.persona-names-allowlist), the runtime-sourced
# `pattern_source` leak-check resolver (resolver lives in claude-klabauter's ops
# layer; as of 2026-07-23 every target below also carries a
# `no-residual-pattern` guard entry that consumes it -- see each target's
# own guards: block, and cross-repo/inbox/2026-07-23-claude-klabauter-em-
# bash-remnant-kill-answers.md Ask 1(b)), `source-glob-present` (empty-source
# guard), `severity: "info"` (rewrite-target-sanity canary), and the 2
# standalone Shape E guard hooks (dispatched by coordinator/bin/publish.py
# `dispatch_standalone_guards`, not phase-wired). 1 (basename-allowlist lint)
# is closed in-engine, no store action. 1 (AC2b extensionless-shebang sniff)
# is expressed by the `extensionless-shebang-absent` guard kind -- see the
# coordinator-claude target's guards: block below. Cosmetic case-variant
# parity is a separately-accepted gap (unrelated to this list). See the
# executor's run report `## Deferred: non-declarative patterns` section for
# the original 7-item enumeration.
schema_version: "1.0.0"

base:
  hooks:
    - path-rewrite
    - substitute
    - stem-rewrite
    - depersonalize
    - basename-rename
    - file-surface

  # Mirrors publish-time-transform.sh's FILES-candidate glob (line ~498) plus
  # its extensionless-shebang sniff (line ~500-517) and EXCLUDED_PREFIXES /
  # EXCLUDED_BASENAMES (lines ~461-473).
  #
  # Translation caveat: EXCLUDED_PREFIXES in the bash oracle are TWO-SEGMENT,
  # rel-path-anchored prefixes ("docs/plans/", "docs/research/", "docs/decisions/",
  # "docs/specs/") -- a raw string-prefix test against the walk root. The store
  # schema's exclude_prefixes (coordinator_core/percolate/surface.py
  # matches_exclude_prefix) matches by SEGMENT-EXACT anywhere in the relative
  # path, not by rel-path-anchored string prefix -- there is no compound
  # "docs/plans" primitive. Approximated below as bare single-segment excludes
  # (plans, research, decisions, specs) alongside the single-segment ones
  # (archive, tasks, experiments, evals) -- broader than the bash oracle (would
  # also exclude e.g. a top-level plans/ dir, not just docs/plans/), never
  # narrower. Flagged in this executor's run report; not a blocking ambiguity
  # since the targets that inherit this file_surface unmodified (coordinator-claude,
  # coordinator-claude-toplevel-install, coordinator-claude-toplevel-wiki) do not
  # currently contain docs/plans-shaped subtrees in their swept content.
  file_surface:
    include_extensions:
      - "*.md"
      - "*.sh"
      - "*.py"
      - "*.json"
      - "*.ts"
      - "*.toml"
      - "*.js"
      - "*.mjs"
      - "*.ps1"
      - "*.cmd"
    shebang_prefixes:
      - "#!"
    exclude_prefixes:
      - "archive"
      - "tasks"
      - "experiments"
      - "evals"
      - "plans"
      - "research"
      - "decisions"
      - "specs"
    exclude_basenames:
      - "publish-time-transform.sh"
      - "check-persona-names.py"
      # These two carry the literal codename vocabulary the checker matches on;
      # transforming them would leave it unable to recognize what it exists to
      # catch. Exact basenames, not the former `*depersonalize*` glob: that
      # wildcard also exempted a downstream data template, which then shipped a
      # private repo name raw because the sweep never read it. Claude-klabauter's
      # store carries the identical narrowing.
      - "depersonalize.py"
      - "test_depersonalize.py"
    # Deliberately EMPTY, and empty is the end-state, not a gap: both entries
    # this list ever held were removed 2026-08-05, and the exact-basenames-over-
    # wildcards direction means the next exemption belongs in
    # `exclude_basenames` above rather than here.
    #
    # `*codename_provenance*` was REMOVED 2026-08-05 — dead in this row. It
    # targeted `coordinator_core/percolate/codename_provenance_seed.py`, which is
    # claude-klabauter-resident and outside the `coordinator/bin,lib` surface routed into
    # this store's targets, so it excluded nothing here. Ruled jointly with
    # claude-klabauter-em, whose drift-test floor is gated on a live glob-based
    # exemption as of `8d47a2642` and so tolerates this list being empty.
    #
    # `*check-persona*` was REMOVED 2026-08-05 — the same wildcard defect the
    # comment above records for `*depersonalize*`, one entry later. It was
    # ratified for `check-persona-names.py` (exact-listed above, and genuinely
    # unable to scrub itself), but it also silently exempted
    # `bin/check-persona-slug-leak.{py,cmd}`, whose docstring named the whole
    # persona roster in plaintext and shipped it to the public mirror unswept.
    # That trampoline holds no matcher vocabulary of its own — the patterns live
    # in the engine's `time_transform.py` — so it has no claim to the exemption
    # and is now swept like everything else.
    exclude_globs: []

  # Mirrors PATH_REWRITE_SOURCES / PATH_REWRITE_DESTS (publish-time-transform.sh
  # ~line 416-429): the static 5-plugin floor. discovery_scan_dir mirrors the
  # script's dynamic plugin-discovery loop (~line 540-548) that extends the
  # floor with any additional plugin dirs found under $TARGET/plugins at
  # runtime.
  path_rewrite:
    seed:
      - src: "plugins/coordinator/"
        dst: "plugins/coordinator/"
      - src: "plugins/data-science/"
        dst: "plugins/data-science/"
      - src: "plugins/game-dev/"
        dst: "plugins/game-dev/"
      - src: "plugins/web-dev/"
        dst: "plugins/web-dev/"
      - src: "plugins/deep-research/"
        dst: "plugins/deep-research/"
    discovery_scan_dir: "plugins"

  # Persona-name table -- mirrors publish-time-transform.sh's NAME_TO_ROLE /
  # ORDERED_KEYS (lines ~208-275). Lowercase-slug forms carry
  # functional_hold:true, mirroring LOWERCASE_SLUG_KEYS (line ~290) -- these
  # collide with parsed-value line shapes (JSON schema `reviewer` enums,
  # agent-definition `"reviewer": "<slug>"` examples) and must be held, not
  # blanket-rewritten. Lowercase "sid" is DELIBERATELY ABSENT (bash oracle's own
  # negative-spec, line ~222-227): it collides catastrophically with the
  # pervasive session_id abbreviation ("local sid=", "--sid", "em_sid", etc.) --
  # do not re-add without a fresh precedent-setting fix upstream in the bash
  # oracle first.
  substitute:
    # DR-146 (published mirror resolver collapses to a single rung): on this
    # (DoE-source) plane, `_engine_root.py::resolve_claude_klabauter_root`'s docstring
    # correctly names rung 2's registry key ("repos.claude_klabauter") as
    # distinct from rung 0's ("repos.claude_klabauter"). Post-percolation the
    # depersonalize table's claude_klabauter -> claude_klabauter mapping (below)
    # collapses rung 2's key onto rung 0's identical string, which would leave
    # this docstring naming two rungs as reading two distinct keys when they
    # read the same one -- self-contradictory prose on a reader's only view of
    # the module. This entry corrects ONLY the published copy's prose (runs
    # ahead of depersonalize, per the engine's fixed pass order) to describe
    # that reality; the executable ladder and the DoE-plane docstring (which
    # genuinely has two distinct keys to name) are untouched. Audit:
    # state/audits/2026-08-07-oss-mirror-rung-collapse.md. Decision: docs/
    # decisions/DR-146-published-mirror-resolver-collapses-to-a-single-rung-docstrings-should-say-so.md
    # `substitute` is applied line-by-line (coordinator_core.percolate.substitute
    # .apply_substitutions splits on `text.splitlines`) -- a key cannot itself
    # span lines, so the key targets the single source line naming rung 2's
    # registry key, and its replacement VALUE embeds its own `\n`s to grow the
    # passage to the published form.
    # The passage this targets lives in `_resolve_live_working_tree`'s docstring,
    # which is where the per-rung breakdown was consolidated when the ladder
    # collapsed to one implementation -- `resolve_claude_klabauter_root`'s own docstring
    # carried a duplicate, separately-drifted rung list and no longer names any
    # registry key. `test_percolate_store_base_substitute_keys_match_source.py`
    # is what detects a key that has drifted out of the source: a stale key does
    # not error at percolate time, it silently no-ops and the mirror ships the
    # self-contradictory prose this entry exists to prevent.
    # match_mode: plain (not the auto-detected word-boundary default) -- the key
    # opens on a non-word character (leading spaces abutting the preceding
    # newline) in situ, so a `\b` anchor at that position never fires; it is
    # meant as an exact literal substring anyway, not a word-generic term.
    - key: "    `repos.claude_klabauter` key -- on this mirror that is the SAME
    registry key the published-engine rung reads; the two-rung distinction
    the engine-source plane preserves collapses to one key here."
      value: "    `repos.claude_klabauter` key -- on this mirror that is the SAME\n    registry key the published-engine rung reads; the two-rung distinction\n    the engine-source plane preserves collapses to one key here."
      match_mode: "plain"
    - key: "UXReviewerFinding"
      value: "UXReviewerFinding"
    - key: "the Staff Engineer"
      value: "the Staff Engineer"
    - key: "the Director of Engineering"
      value: "the Director of Engineering"
    - key: "the Director of Engineering"
      value: "the Director of Engineering"
    - key: "the VP-Product Reviewer"
      value: "the VP-Product Reviewer"
    - key: "the Game Dev Reviewer"
      value: "the Game Dev Reviewer"
    - key: "the Front-End Reviewer"
      value: "the Front-End Reviewer"
    - key: "the Front-End Reviewer"
      value: "the Front-End Reviewer"
    - key: "the UX Reviewer"
      value: "the UX Reviewer"
    - key: "the Data Science Reviewer"
      value: "the Data Science Reviewer"
    - key: "patrik"
      value: "the Staff Engineer"
      functional_hold: true
    - key: "fru"
      value: "the UX Reviewer"
      functional_hold: true
    - key: "pali"
      value: "the Front-End Reviewer"
      functional_hold: true
    - key: "zoli"
      value: "the Director of Engineering"
      functional_hold: true
    - key: "camelia"
      value: "the Data Science Reviewer"
      functional_hold: true
    - key: "yk"
      value: "the VP-Product Reviewer"
      functional_hold: true

  # Boundary-free glued-identifier stem map -- mirrors codename_provenance_seed.py
  # CODENAME_STEM_MAP / CODENAME_STEM_KEYS (D7). Applied as a SEPARATE pass
  # after the exact-key depersonalize pass (engine.py content-transform sweep
  # ordering: path-rewrite -> exact-substitute -> depersonalize -> stem-rewrite ->
  # cosmetic -> basename-rename). Values are the underscore-form lowercase placeholder used
  # inside glued identifiers (claude_klabauter_root=, claude_klabauterRoot) -- NOT the hyphenated
  # prose placeholder from the depersonalize table below, which remains
  # authoritative for hyphen/prose contexts via the exact-key depersonalize path.
  stem_rewrite:
    claude-klabauter: "claude_klabauter"
    example-game-repo: "example_game_repo"

  # Codename/provenance depersonalize table -- byte-for-byte transcription of
  # codename_provenance_seed.py's CODENAME_TO_PLACEHOLDER (D6-D10), oracle-
  # verified during BIG_PORT (test_codename_provenance_seed.py). All entries
  # are token_class "vocabulary" (rewritten, never kept verbatim) -- none of
  # these codenames are "attribution" class, and none require the mixed+private
  # refusal path. Ordering here is for human readability only; longest-match-
  # first firing order is engine-derived from key length (§ schema
  # substituteEntry doc), never store-declared, so declaration order below
  # carries no runtime significance.
  #
  # Negative-spec (transcribed verbatim from the bash oracle's own D9 comment,
  # PM go-live decision 2026-07-10): DoE-claude / doe_claude / DOE_CLAUDE and
  # all compound forms are DELIBERATELY ABSENT below -- DoE-claude is a
  # KEEP-SET token, not a private codename to depersonalize. Do not re-add
  # without a fresh PM ratification overriding that decision.
  depersonalize:
    - key: "example-game-workbench-repo"
      placeholder: "example-game-workbench-repo"
      token_class: "vocabulary"
    - key: "example_game_workbench_repo"
      placeholder: "example_game_workbench_repo"
      token_class: "vocabulary"
    - key: "MACHINE_LOCAL_REPOS_EXAMPLE_GAME_WORKBENCH_REPO"
      placeholder: "MACHINE_LOCAL_REPOS_EXAMPLE_GAME_WORKBENCH_REPO"
      token_class: "vocabulary"
    - key: "example-doctrine-mirror-repo"
      placeholder: "example-doctrine-mirror-repo"
      token_class: "vocabulary"
    - key: "example_doctrine_mirror_repo"
      placeholder: "example_doctrine_mirror_repo"
      token_class: "vocabulary"
    - key: "example-game-repo"
      placeholder: "example-game-repo"
      token_class: "vocabulary"
    - key: "example-game-repo"
      placeholder: "example-game-repo"
      token_class: "vocabulary"
    - key: "EXAMPLE_GAME_REPO_"
      placeholder: "EXAMPLE_GAME_REPO_"
      token_class: "vocabulary"
    - key: "example-sim-repo"
      placeholder: "example-sim-repo"
      token_class: "vocabulary"
    - key: "example-sim-repo"
      placeholder: "example-sim-repo"
      token_class: "vocabulary"
    - key: "example-sim-repo"
      placeholder: "example-sim-repo"
      token_class: "vocabulary"
    # NOTE (revised, code-review Finding 1): bash oracle's "example-sim-repo" ->
    # "exampleSimRepo" (camelCase-glued-identifier form) IS now covered here, via
    # the same-canonical placeholder rather than the seed's divergent camelCase one.
    # store.py's single-placeholder-per-codename invariant (canonical = key.lower())
    # rejects a DIVERGENT placeholder for a lowered canonical already claimed --
    # "example-sim-repo" (lowered) already maps to "example-sim-repo" via the entries
    # above/below -- but it does NOT require every case-form's placeholder to look
    # pretty. Mirroring the exact tradeoff already accepted for the
    # cockpit/claude-klabauter/example-voice-system case_variants:true entries (accept a
    # cosmetically-different-cased placeholder rather than leave a codename
    # unscrubbed), the entry below reuses "example-sim-repo" verbatim under the
    # exact-key "example-sim-repo" so the camelCase form substitutes and closes the leak.
    - key: "example-sim-repo"
      placeholder: "example-sim-repo"
      token_class: "vocabulary"
    - key: "EXAMPLE_SIM_REPO_"
      placeholder: "EXAMPLE_SIM_REPO_"
      token_class: "vocabulary"
    - key: "EXAMPLE_SIM_REPO_API"
      placeholder: "EXAMPLE_SIM_REPO_API"
      token_class: "vocabulary"
    - key: "EXAMPLE_SIM_REPO_something"
      placeholder: "EXAMPLE_SIM_REPO_something"
      token_class: "vocabulary"
    - key: "_EXAMPLE_SIM_REPO_ROOT"
      placeholder: "_EXAMPLE_SIM_REPO_ROOT"
      token_class: "vocabulary"
    - key: "example-cockpit-repo"
      placeholder: "example-cockpit-repo"
      token_class: "vocabulary"
    - key: "example_cockpit_repo"
      placeholder: "example_cockpit_repo"
      token_class: "vocabulary"
    # NOTE: bash oracle hand-authors "cockpit"->"cockpit" and "Cockpit"->"Cockpit" as a
    # case-PRESERVING pair (capitalized key gets a capitalized placeholder, for readable
    # prose substitution). store.py's single-placeholder-per-codename invariant
    # (canonical = key.lower()) hard-rejects this: both keys lower to "cockpit" but the
    # placeholders diverge in case. Historically the engine's case_variants:true mechanism
    # did NOT case-preserve either (§ store.py _case_variants / expand_case_variants -- every
    # generated case-form of a key shared the SAME placeholder string verbatim), so this was
    # temporarily resolved by collapsing to ONE canonical (lowercase-hyphen) placeholder for
    # every case-form -- a flagged behavior loss (a sentence-capitalized "Cockpit" substituted
    # to lowercase "cockpit" rather than "Cockpit"), affecting 3 codenames total in this table
    # (cockpit/Cockpit, claude-klabauter/Claude-Klabauter, example-voice-system/Example-Voice-System).
    # RESOLVED 2026-07-24: claude-klabauter's engine now ships the per-case-variant primitive that was
    # requested here -- the opt-in `case_variant_placeholders: true` field (case-PRESERVING
    # sibling of case_variants). Each of these 3 entries now sets it, restoring the bash
    # oracle's case-preserving pairing (Cockpit->Cockpit, CLAUDE-KLABAUTER->CLAUDE-KLABAUTER,
    # etc.) via engine primitive rather than a hand-authored per-case row. The single-
    # placeholder-per-codename invariant still guards divergent HAND-AUTHORED entries; it is
    # bypassed only for THIS entry's own engine-generated case rows. (The "example-sim-repo" entry
    # above remains on the canonical-collapse path, code-review Finding 1.)
    - key: "cockpit"
      placeholder: "cockpit"
      token_class: "vocabulary"
      case_variants: true
      case_variant_placeholders: true
    - key: "example-stats-repo"
      placeholder: "example-stats-repo"
      token_class: "vocabulary"
    - key: "example_stats_repo"
      placeholder: "example_stats_repo"
      token_class: "vocabulary"
    - key: "example-league-data-repo"
      placeholder: "example-league-data-repo"
      token_class: "vocabulary"
    - key: "example_league_data_repo"
      placeholder: "example_league_data_repo"
      token_class: "vocabulary"
    - key: "example-os-repo"
      placeholder: "example-os-repo"
      token_class: "vocabulary"
    - key: "example-os-repo"
      placeholder: "example-os-repo"
      token_class: "vocabulary"
    - key: "EXAMPLE-OS-REPO"
      placeholder: "EXAMPLE-OS-REPO"
      token_class: "vocabulary"
    - key: "example-store-repo"
      placeholder: "example-store-repo"
      token_class: "vocabulary"
    - key: "example_store_repo"
      placeholder: "example_store_repo"
      token_class: "vocabulary"
    - key: "example-repo"
      placeholder: "example-repo"
      token_class: "vocabulary"
    - key: "example_repo"
      placeholder: "example_repo"
      token_class: "vocabulary"
    - key: "example-repo"
      placeholder: "example-repo"
      token_class: "vocabulary"
    - key: "example-repo"
      placeholder: "example-repo"
      token_class: "vocabulary"
    - key: "example-initiative"
      placeholder: "example-initiative"
      token_class: "vocabulary"
    - key: "example-workstream"
      placeholder: "example-workstream"
      token_class: "vocabulary"
    - key: "example_workstream"
      placeholder: "example_workstream"
      token_class: "vocabulary"
    - key: "claude-klabauter"
      placeholder: "claude-klabauter"
      token_class: "vocabulary"
    - key: "claude_klabauter"
      placeholder: "claude_klabauter"
      token_class: "vocabulary"
    # Same engine-vs-bash-oracle case-preservation conflict as "cockpit" above (see that
    # entry's comment for the full explanation + the 2026-07-24 resolution). Now case-
    # PRESERVING via case_variant_placeholders:true: "Claude-Klabauter" substitutes to Title-case
    # "Claude-Klabauter" (matching the bash oracle's intent) rather than the
    # lowercase-hyphen collapse the bare case_variants:true previously forced.
    - key: "claude-klabauter"
      placeholder: "claude-klabauter"
      token_class: "vocabulary"
      case_variants: true
      case_variant_placeholders: true
    - key: "MACHINE_LOCAL_REPOS_CLAUDE_KLABAUTER_REPO"
      placeholder: "MACHINE_LOCAL_REPOS_CLAUDE_KLABAUTER_REPO"
      token_class: "vocabulary"
    - key: "coordinator_claude_klabauter_root"
      placeholder: "coordinator_claude_klabauter_root"
      token_class: "vocabulary"
    - key: "CLAUDE_KLABAUTER_ROOT_RESOLVED"
      placeholder: "CLAUDE_KLABAUTER_ROOT_RESOLVED"
      token_class: "vocabulary"
    - key: "CLAUDE_KLABAUTER_ROOT_ENV"

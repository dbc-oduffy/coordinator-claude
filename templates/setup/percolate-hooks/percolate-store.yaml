targets:
  # Mirrors coordinator-claude/post-rsync/10-transform.sh (full-tree sweep, no
  # scope-narrowing), coordinator-claude/post-rsync/20-inject-oss-only-skills.sh
  # (inject), coordinator-claude/pre-rsync/10-guard-no-game-dev.sh (guard,
  # Shape E -- see run report), coordinator-claude/pre-ci/10-assert-inert-
  # doctrine-only.sh (guard, AC2a-AC4 -- AC2b via the extensionless-shebang-absent
  # kind, see that guard entry below).
  coordinator-claude:
    hooks:
      - path-rewrite
      - substitute
      - stem-rewrite
      - depersonalize
      - sentinel-strip
      - basename-rename
      - inject
      - guard
    # `coordinator:percolate-only` marker pair -- registers the pre-existing
    # coordinator/templates/*.tmpl + coordinator/templates/postures/*.md
    # "distribution artifact, not this repo's own doctrine" preamble blocks
    # (coordinator/templates/CLAUDE.md.tmpl and the three
    # postures/*.md files) for mechanical removal before publish -- this is the
    # only target whose allowlist (setup/publish-targets.portable) carries any of
    # those four files, so no other target needs this entry. See
    # coordinator_core/percolate/strip_sentinel.py (claude-klabauter) for the
    # engine-side mechanism this registers into.
    #
    # A second, `#`-comment-shaped pair (F-016) does the same job for
    # coordinator/templates/machine-local/registry.toml.example: the HTML-comment
    # form above is not valid TOML syntax, so a TOML source file needs its own
    # marker form. It fences the file's two `repos.claude_klabauter` rows (root
    # table + `[regeneratability]`) -- DoE-plane-only, engine-source-working-tree
    # rows with no OSS meaning. Without this, the depersonalize table's
    # claude_klabauter -> claude_klabauter rewrite (below) collapses each fenced row
    # onto its `repos.claude_klabauter` sibling, producing a DUPLICATE KEY --
    # invalid TOML -- on every publish (the `[regeneratability]` pair additionally
    # disagreeing in value: session-accumulated-must-survive-crash vs
    # idempotent-regeneratable). Stripping removes the row instead of renaming it,
    # keeping the projection injective, regardless of pass order: stripping
    # deletes the whole fenced region outright, so the row never reaches the
    # projection whether or not depersonalize has already renamed it first.
    sentinel_strip:
      - start_marker: ""
      - start_marker: ""
      - start_marker: ""
    inject:
      # Confirmed 2026-07-17: coordinator/dist/oss-only-skills/ currently has
      # exactly one child directory (coordinator-update) -- this static entry
      # covers the full inject surface as of this check.
      - src: "<coordinator-content-root>/dist/oss-only-skills/coordinator-update"
        dst: "skills/coordinator-update"
        required_children:
          - "SKILL.md"
      # C-W3 item 1 -- coordinator-claude/post-rsync/10-transform.sh's
      # `.persona-names-allowlist` scaffold-if-absent step (finish-op-
      # percolate-recipe.md §2.1 step 1 / §4 item 1) was resolved by this
      # `create-if-absent` entry, but the 2026-08-05 mirror rebuild made it
      # redundant and destructive: `coordinator-claude-publish-repo-toplevel`'s
      # own `inject` (added same day, § that section's comment) now copies the
      # WHOLE `.github` tree -- including `.persona-names-allowlist` -- to this
      # same target root, `mode: "overwrite"`. Both entries' `dst` therefore
      # overlap under one target (`publish-mirror:coordinator_claude`, both
      # rows' `dest_subdir` empty -- § that section's comment); `_copy_tree_overwrite`
      # prunes/overwrites the whole subtree it owns, so leaving this
      # `create-if-absent` entry in place would not protect an
      # operator-customized allowlist -- the sibling entry clobbers it anyway,
      # it would just make the outcome depend on entry-list order. Removed
      # rather than reconciled: the engine's inject schema has no per-file
      # exclude for a tree copy (`run_inject`/`_copy_tree_overwrite`,
      # claude-klabauter), so the file's source of truth is now the
      # dist-committed copy at
      # dist/mirror-native/coordinator-claude/.github/.persona-names-allowlist,
      # not an operator-editable mirror-repo file.
    guards:
      # Shape E (§3.5 of the recipe) -- checks the SOURCE tree
      # ($HOME/.claude/plugins/coordinator-claude/game-dev), NOT target_root.
      # run_pre_rsync's phase function does not dispatch guards at all, and
      # run_post_rsync/run_pre_ci dispatch this SAME section['guards'] list
      # against target_root -- if invoked via those phase calls this entry
      # checks target_root/game-dev (vacuously true, not the intended source
      # check). C-W3 item 7: `coordinator/bin/publish.py`
      # `dispatch_standalone_guards` invokes this exact entry as a standalone
      # `guards.run_guards()` call against the SOURCE root (`effective_source_dir`),
      # never via `percolate.run(phase=...)`. This store-declared copy stays
      # (still dispatched normally at post_rsync/pre_ci, checking
      # target_root/game-dev) -- harmless-but-vacuous, not removed, since the
      # store has no per-entry "standalone-only, skip at phase-dispatch"
      # primitive.
      - kind: "source-dir-absent"
        params:
          path: "game-dev"
        override_env: "COORDINATOR_OVERRIDE_GAMEDEV_GUARD"
      # Pre-inject layout-detection guard (recipe §3.2 correction): flat v3
      # plugin manifest must exist before injecting skills/.
      - kind: "dirs-present"
        params:
          paths:
            - ".claude-plugin/plugin.json"
      # RESOLVED 2026-08-01 (C5): AC2a/AC2b/AC2c (forbidden-script-globs,
      # extensionless-shebang-absent, dirs-absent over bin/hooks/lib) asserted
      # a doctrine-only, no-executable-surface shape for this row. `d4a566c99`
      # (2026-07-26) widened this row's own allowlist
      # (setup/publish-targets.portable) to publish bin,lib,hooks as a real
      # executable surface (bin/lib routed from claude-klabauter via
      # source_map; hooks from this repo) and did not touch this guards
      # block, leaving the three assertions asserting the opposite of what
      # the row now ships. Branch determined on evidence, not inferred from
      # the store alone: neither the fire-and-block nor the inert-and-silent
      # branch has been exercised -- no coordinator-claude publish (dry-run
      # or real) has completed since d4a566c99. The mirror clone
      # (~/X/coordinator-claude) has main == origin/main at 9a8d7b2c9
      # (2026-07-10, pre-dates the widening by 16 days); its own bin/hooks/lib
      # directory mtimes are 2026-07-13; setup/percolate-state/*.lastsync
      # entries for this target family all pin the same pre-widening SHA;
      # and state/percolate-v3/*.log run records are all dated 2026-07-06
      # through 2026-07-10. Removed rather than narrowed: the row's whole
      # premise (no scripts ship) is gone, not merely mis-scoped, so a
      # narrowed version would still assert something false about the
      # row's own allowlist. What the row actually still guarantees against
      # bin/hooks/lib is AC4 (skills/agents/commands survive) plus the
      # no-residual-pattern leak oracles, which are not plugin-shape
      # assertions and were never contradictory.
      #
      # RESOLVED 2026-08-01 (C5, second pass): AC3 (`dirs-absent` over
      # `hooks/hooks.json`) removed as the FOURTH instance of the same
      # contradiction, on the same evidence. The C5 pass above left it
      # standing on the belief it was non-contradictory; that was wrong.
      # `d4a566c99` allowlisted `hooks` as this row's third entry, and the
      # publish write-set carries `UPDATE: hooks.json` under `--- hooks ---`,
      # so the row ships exactly the file AC3 asserted absent. Reported by
      # claude-klabauter-em after the first completed republish since the
      # widening failed post_rsync on it (cross-repo/inbox/2026-08-01-project-
      # claude-klabauter-em-ac3-dirs-absent-hooks-json-is-the-fourth-contradiction.md) --
      # the same never-executed-so-never-noticed cause as the other three:
      # removing them only let the run reach this one.
      #
      # Removed rather than narrowed, and the narrowing option was weighed
      # rather than skipped. AC3's intent ("no executable hook wiring ships")
      # is obsolete, not mis-stated: `hooks.json` is the plugin's hook
      # MANIFEST, so shipping `hooks/scripts/` without it would publish an
      # unwired, inert surface -- the manifest's presence is now the row's
      # intent, not its violation. `dirs-absent` is a binary presence
      # assertion with nothing left to narrow to, and content-level
      # protection over the manifest is already carried by the
      # no-residual-pattern leak oracles below, whose `include_extensions`
      # covers `*.json`. Verified at removal time: `coordinator/hooks/
      # hooks.json` is at zero hits for host/user/repo-path and machine-slug
      # leaks, so this is not trading a shape guard for an open hole.
      # AC4: doctrine survived -- skills/agents/commands exist, and the
      # skill-embedded template dir survives the over-strip regression guard.
      - kind: "dirs-present"
        params:
          paths:
            - "skills"
            - "agents"
            - "commands"
            - "skills/new-project/templates/next-app/src/lib"
      # C-W3 item 2 -- registry codename-leak guard (2026-07-23 rollout,
      # see cross-repo/inbox/2026-07-23-claude-klabauter-em-bash-remnant-
      # kill-answers.md Ask 1(b)). The engine seam (percolate_run.py:98,134)
      # has forwarded a registry-derived alternation resolver into
      # post_rsync/pre_ci unconditionally since ec766767 -- this store
      # carried zero entries declaring `pattern_source: {registry_codenames:
      # true}` to consume it, so the backstop never fired on the publish
      # path. Shape per claude-klabauter's coordinator/tests/
      # test_percolate_deferred.py:399-402.
      - kind: "no-residual-pattern"
        params:
          pattern_source:
            registry_codenames: true
            form: "alternation"
          include_extensions:
            - "*.md"
            - "*.sh"
            - "*.py"
            - "*.json"
            - "*.ts"
            - "*.toml"
            - "*.js"
            - "*.mjs"
            - "*.ps1"
            - "*.cmd"
      # Gendered-pronoun publish-output backstop. Not tied to any one source
      # file or fix -- this is a standing boundary check over what actually
      # SHIPS to the OSS mirror, independent of anyone's belief about which
      # source files percolate. (It would have caught the scoping error behind
      # an earlier draft of this comment, which cited a specific source file's
      # substitute pairs as its justification: that file was never in this
      # target's publish allowlist and never shipped, so there was nothing for
      # those pairs to backstop. The guard itself is unaffected by that error --
      # it inspects the actual rsynced tree, not anyone's model of it.)
      # `params.pattern` is a static literal regex (schema-supported alternative to
      # `pattern_source`; no engine change needed -- `check_no_residual_pattern`
      # (claude-klabauter coordinator_core/percolate/guards.py) already accepts either).
      # Mirrors `coordinator/tests/test_percolating_surfaces_carry_no_gendered_pronouns.py`'s
      # own `GENDERED_PRONOUN` pattern verbatim (source-side gate); this is the same
      # check re-run POST-transform, over the actual publish output.
      #
      # `include_extensions` is `*.md` -- PROSE ONLY. The SAME list this
      # store's own `base.file_surface.include_extensions` walks (PM direction,
      # 2026-07-30: cover the whole published surface, not prose alone -- a
      # gendered pronoun could otherwise enter a published Python docstring, a
      # JSON `description` field, or a `.ps1`/`.cmd` comment with nothing to catch
      # it). Verified at widening time: all non-`.md` published files were at zero
      # hits, so this is a coverage-hole close, not a live-leak fix. If a future
      # widening ever needs a DIFFERENT extension set than `file_surface`'s own,
      # split the alias here rather than silently diverging -- the two lists are
      # deliberately the same list right now, not independently maintained twins.
      # `s/he` is boundary-anchored on BOTH sides. Unanchored it matches inside
      # ordinary paths -- `schemas/health`, `users/help.md`, `docs/this/here` all
      # contain the literal `s/he` -- and published prose cites paths like
      # those constantly. On a PUBLISH guard that misfire is worse than a false
      # finding in a test: it fails the percolation over a pronoun that was never
      # there. The leading `\b` carries the fix (in `schemas/health` the `s`
      # follows a word character, so no boundary exists there).
      - kind: "no-residual-pattern"
        params:
          pattern: '(?i)\b(he|him|his|she|her|hers|himself|herself)\b|he\s+or\s+she|\(s\)he|\bs/he\b'
          include_extensions:
            - "*.md"

  # Mirrors coordinator-claude-publish-repo-docs/post-rsync/10-transform.sh.
  # target_dir = the publish repo's docs/ (maxdepth-1 files only in the bash
  # oracle). file_surface has no native maxdepth primitive (recipe §2.1
  # caveat) -- approximated via exclude_prefixes naming every subdirectory
  # owned by another percolation target. Maintenance burden identical to the
  # bash oracle's hardcoded scope comment, just moved into YAML: a new
  # subdirectory target added later needs this list updated by hand.
  coordinator-claude-publish-repo-docs:
    hooks:
      - path-rewrite
      - substitute
      - stem-rewrite
      - depersonalize
      - basename-rename
      - guard
    file_surface:
      # exclude_prefixes REPLACES (not unions with) base's list -- shallow-merge
      # is per-key (recipe finish-op-percolate-recipe.md:88-91), and this key is
      # fully redeclared here. Omitting archive/tasks/experiments/evals from this
      # target's list (present in base) is verified-intentional: this target's
      # scope is the publish repo's docs/ subtree, which does not contain
      # docs/archive, docs/tasks, docs/experiments, or docs/evals subdirs.
      exclude_prefixes:
        - "wiki"
        - "decisions"
        - "evolution"
        - "plans"
        - "research"
        - "specs"
    guards:
      # C-W3 item 2 -- registry codename-leak guard (2026-07-23 rollout).
      # This target carried no `guard` hook at all before this rollout;
      # see the coordinator-claude target's guards: block above for the
      # full rationale (cross-repo/inbox/2026-07-23-claude-klabauter-em-
      # bash-remnant-kill-answers.md Ask 1(b)).
      - kind: "no-residual-pattern"
        params:
          pattern_source:
            registry_codenames: true
            form: "alternation"
          include_extensions:
            - "*.md"
            - "*.sh"
            - "*.py"
            - "*.json"
            - "*.ts"
            - "*.toml"
            - "*.js"
            - "*.mjs"
            - "*.ps1"
            - "*.cmd"

  # INSTALL.md at the publish repo root, sourced from this repo's own root (`.`,
  # allowlist-narrowed to that one file) rather than from a committed copy under
  # dist/ -- one body for one truth, with the DoE-only fenced regions stripped by
  # the engine's INSTALL.md transform at copy time.
  #
  # Its Phase-2 delete sweep is bounded by this repo's ROOT `.percolate-ignore`,
  # not by anything in this block: the restricted source carries exactly INSTALL.md,
  # so every other top-level file at the publish repo root is an orphan to this row
  # and is reaped unless that ignore file protects it. Read that file before adding
  # any row-root file anywhere in the topology.
  #
  # exclude_prefixes replaces base's list with the publish repo's own top-level
  # directory set, matching coordinator-claude-publish-repo-toplevel: this row's
  # dest_dir is the mirror ROOT, so an inherited base list would walk the whole
  # published tree to transform a single root-level file.
  coordinator-claude-repo-root-install-md:
    hooks:
      - path-rewrite
      - substitute
      - stem-rewrite
      - depersonalize
      - basename-rename
      - guard
    file_surface:
      exclude_prefixes:
        - ".claude-plugin"
        - ".git"
        - ".github"
        - "agents"
        - "bin"
        - "commands"
        - "docs"
        - "hooks"
        - "lib"
        - "schemas"
        - "skills"
        - "snippets"
        - "templates"
        - "cockpit-contract"
    guards:
      # Registry codename-leak guard -- same rationale as the coordinator-claude
      # target's guards: block above. INSTALL.md names sibling repos and machine
      # paths in its DoE-only regions; those regions are stripped before this
      # guard runs, and the guard is what proves the strip was complete.
      - kind: "no-residual-pattern"
        params:
          pattern_source:
            registry_codenames: true
            form: "alternation"
          include_extensions:

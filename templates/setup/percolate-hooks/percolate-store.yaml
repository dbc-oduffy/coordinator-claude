  # Mirrors coordinator-claude-publish-repo-toplevel/post-rsync/10-transform.sh
  # (maxdepth-1 sweep at the publish repo ROOT) and .../pre-rsync/10-prune-
  # stale-handoff-cruft.sh (guard, Shape E). exclude_prefixes enumerated from
  # the actual coordinator-claude publish-repo checkout's top-level directory
  # set (verified on disk 2026-07-17, not fabricated) -- same maxdepth-1
  # approximation caveat as coordinator-claude-publish-repo-docs above.
  coordinator-claude-publish-repo-toplevel:
    hooks:
      - path-rewrite
      - substitute
      - stem-rewrite
      - depersonalize
      - basename-rename
      - inject
      - guard
    file_surface:
      # exclude_prefixes REPLACES (not unions with) base's list -- shallow-merge
      # is per-key (recipe finish-op-percolate-recipe.md:88-91), and this key is
      # fully redeclared here. Omitting archive/tasks/experiments/evals from this
      # target's list (present in base) is verified-intentional: this target's
      # top-level archive/ and tasks/ are pruned separately by the
      # "prune-stale-paths" guard below (archive/handoffs, tasks/handoffs), and
      # the "always full-tree sweep" design principle (recipe §1.7) argues for
      # sweeping remaining content here rather than excluding it.
      exclude_prefixes:
        - ".claude-plugin"
        - ".git"
        - ".github"
        - "agents"
        - "bin"
        - "commands"
        - "docs"
        - "hooks"
        - "lib"
        - "skills"
    # The mirror's own CI harness (33 files: run-all-checks.py and the checkers it
    # drives, allowlists, issue/PR templates, workflows). Homed at
    # dist/mirror-native/coordinator-claude/.github/ after a clean-slate mirror
    # rebuild (2026-08-05) found it existing ONLY in the publish repo, authored
    # nowhere in source -- the mirror could not be reconstructed from this tree,
    # and wiping it took the end-of-run identity gate's own checker with it.
    # Direct precedent: claude-klabauter's claude-klabauter block
    # (setup/percolate-hooks/percolate-store.yaml:1203-1242), same failure mode,
    # same resolution.
    #
    # THIS ROW, not the `coordinator-claude` mirror row: inject resolves `dst`
    # against `target.dest_dir` (= dest_root/dest_subdir). (Review: code-reviewer,
    # 2026-08-05 -- corrected a false uniqueness claim here: this row and the
    # `coordinator-claude` row both carry an empty `dest_subdir` in
    # setup/publish-targets.portable, so both resolve `dst` to the mirror repo
    # ROOT -- this row is not unique in that respect.) The actual reason this
    # row hosts the `.github` inject rather than `coordinator-claude`: this
    # section (`-publish-repo-toplevel`) owns the publish repo's TOP-LEVEL
    # directory furniture (README, CI harness, issue/PR templates -- § this
    # section's own header comment), a distinct content domain from
    # `coordinator-claude`'s job of mirroring the plugin's own machinery
    # (bin/lib/agents/skills/etc. from `plugin-source:coordinator-claude`).
    # `.github`'s CI harness belongs with the repo-toplevel content it
    # governs, not the plugin-content mirror, even though both rows' `dst`
    # happen to coincide at the mirror repo root.
    #
    # `inject` rather than a publish row is structural, not preference: inject
    # dispatches AFTER the content-transform sweep, so check-persona-names.py's
    # BANNED vocabulary -- literal fleet codenames, by construction -- is not
    # itself rewritten into placeholders, which would leave the checker reporting
    # green over a dirty tree. This target's own `exclude_prefixes` above already
    # carries `.github` for the same reason, as does base's `exclude_basenames`
    # (check-persona-names.py) and `exclude_globs` (*check-persona*).
    #
    # Survives this row's own flat-mirror sweep: Phase 2 deletes top-level FILES
    # only, never directories (setup/publish_sync.py:877), so an injected
    # `.github/` is not reaped between passes.
    inject:
      - src: "<coordinator-content-root>/dist/mirror-native/coordinator-claude/.github"
        dst: ".github"
        required_children:
          - "scripts/run-all-checks.py"
          - "scripts/check-persona-names.py"
    guards:
      # Shape E (§3.5/§2.7 of the recipe) -- must run pre-rsync (before the
      # sync's delete-list computation), but run_pre_rsync's phase function
      # does not dispatch guards at all (only the preserve-destination-native
      # backup leg). This entry IS target-root-relative (unlike the game-dev
      # guard above) so it functions correctly if invoked via run_post_rsync's
      # guard dispatch too -- just later than the bash oracle's original
      # pre-sync timing. C-W3 item 7: `coordinator/bin/publish.py`
      # `dispatch_standalone_guards` now ALSO fires this exact entry as a
      # standalone `guards.run_guards()` call against `target.dest_dir`,
      # pre-sync, to match the retired hook's original timing -- this
      # store-declared copy stays (dispatched normally at post_rsync/pre_ci
      # too), which is harmless: `prune-stale-paths` is idempotent, so a
      # second pass over already-pruned paths is a no-op.
      - kind: "prune-stale-paths"
        params:
          paths:
            - "archive/handoffs"
            - "tasks/handoffs"
      # C-W3 item 2 -- registry codename-leak guard (2026-07-23 rollout).
      # See the coordinator-claude target's guards: block above for the
      # full rationale (cross-repo/inbox/2026-07-23-claude-klabauter-em-
      # bash-remnant-kill-answers.md Ask 1(b)).
      - kind: "no-residual-pattern"
        params:
          pattern_source:
            registry_codenames: true
            form: "alternation"
          include_extensions:
            - "*.md"
            - "*.sh"
            - "*.py"
            - "*.json"
            - "*.ts"
            - "*.toml"
            - "*.js"
            - "*.mjs"
            - "*.ps1"
            - "*.cmd"

  # repo-cut -- the one-shot bootstrap kind (docs/plans/2026-08-08-cut-new-repos-
  # through-the-percolation-engine.md, C6/C7) that creates and registers a new
  # cut repo. This section's ONLY job is delivering the guard-test payload
  # (the six coordinator/tests/templates/*.py tripwire tests plus their shared
  # root-resolution helper) into the new repo's tree.
  #
  # `inject`, never `flat-mirror`, and the reason is written here because it is
  # expensive to rediscover: flat-mirror's Phase 2 delete-sweep
  # (setup/publish_sync.py:874, sync_flat_mirror) removes a destination file
  # whose source has since disappeared -- pointed at a cut repo's guard tests,
  # that sweep would delete a consumer's own guard test out from under them the
  # moment this store's copy of it is renamed, moved, or removed. Inject does
  # not sweep; it only ever adds.
  #
  # Every guard entry below uses `mode: create-if-absent`
  # (percolate-store.schema.json:258-261) -- never `overwrite`, and never
  # flat-mirror. `create-if-absent` copies only when dst is absent, so a
  # consumer's customized copy of a guard test is never clobbered on a re-run,
  # while a repo that is missing the test still gets it filled in. This is the
  # same non-degrading-convergence principle C6 states for repo-cut as a whole
  # (a one-shot bootstrap, not a durable row that re-runs creation) applied one
  # level down, to the field.
  #
  # `_tripwire_root.py` (landed by a peer chunk under
  # coordinator/tests/templates/, not created or edited here) is a
  # REQUIRED CHILD of every guard entry below, expressed via `required_children`
  # rather than as its own separate inject entry: a guard template delivered
  # without it cannot resolve its own repo root, so the dependency belongs on
  # each entry that needs it, not floating as an independently-optional row.
  #
  # OWNERSHIP against DR-PERCOLATE-001
  # (coordinator/docs/decisions/DR-PERCOLATE-001-publish-rows-owned-by-the-consuming-repo.md):
  # the DR rules "ownership follows consumption," but the rows below stay
  # DoE-owned and do not transfer once the cut repo exists -- this is the DR's
  # own "Not decided here" carve-out, on stronger grounds than the DR's own
  # coordinator-claude example: the repo-cut consumer does not exist yet when
  # these rows are authored, so it cannot author its own config, and the rows
  # encode fleet-wide doctrine (canonical structure, guard delivery, line-ending
  # policy) rather than any one target's release-specific configuration. A cut
  # repo that later wants to diverge does so via a row-level override in its
  # own tree, not a transfer of these seed rows.
  repo-cut:
    hooks:
      - inject
    inject:
      - src: "<coordinator-content-root>/tests/templates/test_foreign_platform_paths.py"
        dst: "tests/templates/test_foreign_platform_paths.py"
        mode: "create-if-absent"
        required_children:
          - "_tripwire_root.py"
      - src: "<coordinator-content-root>/tests/templates/test_guard_wiring_completeness.py"
        dst: "tests/templates/test_guard_wiring_completeness.py"
        mode: "create-if-absent"
        required_children:
          - "_tripwire_root.py"
      - src: "<coordinator-content-root>/tests/templates/test_machine_local_state_tracked.py"
        dst: "tests/templates/test_machine_local_state_tracked.py"
        mode: "create-if-absent"
        required_children:
          - "_tripwire_root.py"
      - src: "<coordinator-content-root>/tests/templates/test_no_bare_console_subprocess.py"
        dst: "tests/templates/test_no_bare_console_subprocess.py"
        mode: "create-if-absent"
        required_children:
          - "_tripwire_root.py"
      - src: "<coordinator-content-root>/tests/templates/test_no_bare_python_spawn.py"
        dst: "tests/templates/test_no_bare_python_spawn.py"
        mode: "create-if-absent"
        required_children:
          - "_tripwire_root.py"
      - src: "<coordinator-content-root>/tests/templates/test_registry_toml_machine_paths.py"
        dst: "tests/templates/test_registry_toml_machine_paths.py"
        mode: "create-if-absent"
        required_children:
          - "_tripwire_root.py"

  # Mirrors coordinator-claude-toplevel-install/post-rsync/10-transform.sh.
  # target_dir is already narrow (a flat install-mirror target) -- no
  # file_surface override needed. No leak-guard in the bash oracle's
  # equivalent form for this target's specific hook; this target now
  # carries the registry codename-leak guard directly (C-W3 item 2,
  # 2026-07-23 rollout -- see the coordinator-claude target's guards:
  # block above for rationale).
  coordinator-claude-toplevel-install:

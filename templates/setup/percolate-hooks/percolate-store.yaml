    # Machine slugs -> role names. These are the operator's physical machines,
    # and they appear in published prose mostly as BRANCH prefixes
    # (`work/<machine>/<dates>`) and as live-probe attributions ("probe on X
    # (macOS)"). To an OSS reader the codename carries no information at all --
    # it cannot be looked up, and it reads as a proper noun that must matter.
    # The role name keeps the branch CONVENTION legible (that branches are
    # per-machine) while dropping the unresolvable token. Convention is the one
    # already prescribed by bin/depersonalize-identity.example.yaml class 3:
    # first machine = machine-a, second = machine-b, and so on.
    #
    # ONE PLACEHOLDER PER PHYSICAL MACHINE, not per spelling. Machine-c below
    # has THREE live slugs -- the persisted branch slug, its unhyphenated form,
    # and the hostname the same box actually reports -- and the corpus contains
    # a passage narrating precisely that split. Mapping them to different role
    # names would hand the OSS reader two machines where there is one, which is
    # a worse failure than the raw codename: it invents a fact.
    # Every case form gets its OWN key, exactly as example-os-repo/example-os-repo above do.
    # `case_variants: true` is NOT sufficient here and was measured, not assumed:
    # it expands to Title/UPPER of the whole key, so it covers "Bettaair" but not
    # "Machine-c", and it left `Machine-a` (30 live occurrences) and `Machine-c` (13)
    # substituting to nothing at all. Placeholders are written case-preservingly
    # (Machine-a -> Machine-a alongside machine-a -> machine-a); the store's
    # single-placeholder-per-codename check canonicalizes BOTH key and
    # placeholder before comparing, so that is one codename mapping to one
    # placeholder, not a divergence. Grouping below is longest-first per machine
    # for READABILITY only -- order_entries re-sorts every entry by -len(key) at
    # apply time, so declaration order here is not load-bearing.
    #
    # The hand-authored list is now checked rather than trusted: the store
    # validator requires every camel-case key to carry its all-lower and
    # all-UPPER siblings, so a forgotten spelling fails the load instead of
    # silently publishing the private codename. Adding a machine here means
    # adding its three forms; the validator will name any you miss.
    # Generation is not an option here regardless: `Machine-c`/`Machine-b`/
    # `Machine-c` are camel-case keys, which `case_variants: true` cannot derive
    # from a lowercase canonical (see the "Bettaair" note above) -- this family
    # stays hand-authored on that ground alone.
    # (Historical note: an earlier revision of this comment also cited a second,
    # now-fixed reason -- `case_variant_placeholders` used to turn a hyphenated
    # placeholder like "machine-a" into "Machine-A", capitalizing the machine-
    # slug suffix as if it were an initial. Claude-klabauter's store.py now
    # title-cases a substitution target segment-by-segment and leaves a
    # single-letter segment alone, so "machine-a" -> "Machine-a" is safe under
    # `case_variant_placeholders` too. That fix does not change anything here --
    # the camel-key limitation above is sufficient on its own to keep this
    # family hand-authored.)
    - key: "Machine-a"
      placeholder: "Machine-a"
      token_class: "vocabulary"
    - key: "machine-a"
      placeholder: "machine-a"
      token_class: "vocabulary"
    - key: "MACHINE-A"

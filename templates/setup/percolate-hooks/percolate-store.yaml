            - "*.py"
            - "*.json"
            - "*.ts"
            - "*.toml"
            - "*.js"
            - "*.mjs"
            - "*.ps1"
            - "*.cmd"

  # Worked example (recipe §3.3) -- the cleanest 1:1 mapping. Mirrors the
  # PAIRED pre-rsync/10-backup-allowlist.sh + post-rsync/10-restore-
  # allowlist.sh (preserve-destination-native), post-rsync/20-transform.sh
  # (content sweep), and post-rsync/30-verify-toplevel-wiki.sh (guards --
  # checks 1/4/6 declarable (1's content-match half now `severity: "info"`,
  # 6 now `source-glob-present`, both C-W3); check 2 (dynamic leak pattern) is
  # wired via `params.pattern_source` + claude-klabauter's registry resolver (C-W3
  # item 2, 2026-07-23 rollout) and now declared below via this target's own
  # `no-residual-pattern` guard entry, mirroring the coordinator-claude
  # target's leak-check entry pattern; 5 (store-authoring lint, not a
  # runtime guard) is CLOSED 2026-07-24 -- claude-klabauter ships it as the named
  # `lint_store` engine primitive (store.py, = validate_store_dict incl.
  # the `_check_basename_allowlist_no_separator` no-`/` check on
  # preserve_destination_native.basename_allowlist entries); a dev-time
  # lint by design, not wired into this target's runtime guards block).
  #
  # sentinel_home_override deliberately NOT set: DoE's bash convention used
  # $HOME/.claude/setup/percolate-state, but inject.py's sentinel_home_override
  # is consumed via bare `Path(override)` with no ~/$HOME expansion -- a
  # literal "$HOME/..." string would resolve to a bogus relative path
  # (a literal directory named "$HOME"), not the user's home. Since there is no
  # portable way to express "the operator's home" as a static YAML string here,
  # this target accepts the engine's own portable default
  # (~/.local/state/percolate) rather than fight the field's literal-path
  # contract. Purely an internal sentinel-location implementation detail, not
  # user-visible; both backup and restore consult the SAME default
  # consistently.
  coordinator-claude-toplevel-wiki:
    hooks:
      - path-rewrite
      - substitute
      - stem-rewrite
      - depersonalize
      - basename-rename
      - guard
    guards:
      # Check 6 (empty-source guard) -- C-W3 item 3, resolved by the
      # `source-glob-present` primitive (ec766767): asserts the SOURCE tree
      # (not target_root) has >=1 `.md` file. Dispatches against `source_root`
      # -- REQUIRES the driver to pass `source_root` on every `percolate.run`
      # call this entry's phase runs in (§ coordinator/bin/publish.py
      # `dispatch_percolate_post_rsync`/`_pre_ci`, which already do
      # unconditionally as of C-W2); a missing `source_root` is a loud
      # `GuardCheckError` from `guards.run_guard`, never a silent
      # wrong-tree check. Checks below are in the bash oracle's own numbered
      # order.
      - kind: "source-glob-present"
        params:
          glob: "*.md"
          # include_extensions is REQUIRED here, not inherited from this
          # target's `file_surface.include_extensions` -- guards.py's
          # `_walk_for_guard` only ever reads scoping params off the guard
          # ENTRY's own `params` (§ that function's docstring: "omitting
          # them yields the routine's own defaults... no includes match"),
          # never the section's `file_surface`. Without this, the walk
          # includes nothing and the guard always reports "no file
          # matching *.md", even when .md files are present -- verified via
          # coordinator/tests/test_percolate_deferred.py
          # TestSourceGlobPresent (a `.md`-only-source case failed until
          # this param was added).
          include_extensions:
            - "*.md"
      # Check 4 (file-count delta): expected count is the caller-supplied
      # effective_source_count (computed by the driver from the wiki source
      # dir against file-surface exclusions, e.g. .percolate-ignore), not a
      # store-declared expected_count -- percolate.run's caller must pass
      # effective_source_count for this entry to evaluate correctly.
      #
      # `include_extensions` is REQUIRED here for the same reason as the
      # source-glob-present entry above -- `_walk_for_guard` reads scoping
      # params off the guard ENTRY's own `params`, never the section's
      # `file_surface`, and an empty include list matches NOTHING. Omitting
      # it makes the OBSERVED count structurally 0 on every run against any
      # tree, so the guard fails a materially correct publish.
      - kind: "file-count-delta"
        params:
          tolerance: 0
          include_extensions:
            - "*.md"
      # C-W3 item 2 -- registry codename-leak guard (2026-07-23 rollout).
      # See the coordinator-claude target's guards: block above for the
      # full rationale (cross-repo/inbox/2026-07-23-claude-klabauter-em-
      # bash-remnant-kill-answers.md Ask 1(b)).
      - kind: "no-residual-pattern"
        params:
          pattern_source:
            registry_codenames: true
            form: "alternation"
          include_extensions:
            - "*.md"
            - "*.sh"
            - "*.py"
            - "*.json"
            - "*.ts"
            - "*.toml"
            - "*.js"
            - "*.mjs"
            - "*.ps1"
            - "*.cmd"

  # File-rename table -- mirrors publish-time-transform.sh's
  # CODENAME_BASENAME_RENAMES / rename_codename_basenames() (lines ~682-687).
  # Hand-synced with the four basename-shaped depersonalize entries above (the
  # bash oracle keeps these as two independently-maintained tables by design,
  # not derived from one another -- see that function's own header comment on
  # why a clean derivation was rejected). Applied LAST by the engine, after

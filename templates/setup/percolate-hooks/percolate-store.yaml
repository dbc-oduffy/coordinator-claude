    # itself still published under the old basename, so the transform broke its
    # own link -- caught by validate-references the first round that published
    # a page citing it (DIRECTORY_GUIDE.md, via the wiki-seed expansion).
    - src: "example-game-repo-for-your-ue-project.md"
      dst: "example-game-repo-for-your-ue-project.md"


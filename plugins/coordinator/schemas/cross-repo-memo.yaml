schema: cross-repo-memo
applies_to: "cross-repo/inbox/[0-9]*.md"
# ---------------------------------------------------------------------------
# Spec backlink: docs/plans/2026-05-23-cross-repo-single-surface-and-canonical-scaffold.md § Chunk 3
# Prior spec: docs/plans/2026-05-21-cross-repo-memo-discoverability.md § Memo frontmatter schema
#
# Single surface: cross-repo/ at receiver-repo root. Sender writes one dirty file
# here (status: open); receiver flips to status: actioned in place. No dual-write,
# no sender-side copy, no closure move. Terminal state lives in receiver's git log.
#
# applies_to uses digit-prefixed glob [0-9]*.md to match dated memos
# (YYYY-MM-DD-topic.md) while excluding cross-repo/README.md and other
# non-memo files. [0-9] bracket-class passthrough is handled by globToRegex
# in bin/lib/schema.js.
#
# Applies only to memos with created: >= 2026-05-22 (grandfathered cutoff).
# Memos dated 2026-05-21 and earlier are pre-lifecycle artifacts; the validator
# skips them.
#
# State machine: open → actioned (terminal, in-place)
# Back-compat statuses retained for grandfathered memos: reviewed, action_taken,
# closed, superseded (from the 2026-05-21 dual-write lifecycle — no longer issued).
#
# Lifecycle timestamps are ISO-8601 CONVENIENCE METADATA only. The authoritative
# audit trail lives in the receiver repo's git log of the lifecycle-transition commit.
# The validator MUST NOT impose SHA-requirement logic on these timestamp fields —
# this is a different pattern from handoff's shipped_in: <SHA>.
# ---------------------------------------------------------------------------
required:
  title: string
  from: string
  to: string
  created: iso-date
  status:
    type: enum
    # Primary lifecycle: open → actioned (terminal, receiver-side in-place edit).
    # Back-compat values retained for grandfathered 2026-05-21 dual-write memos:
    # reviewed, action_taken, closed, superseded.
    values: [open, actioned, reviewed, action_taken, closed, superseded]
  delivery_mode:
    type: enum
    # Single-surface model: the CLI only ever issues 'receiver-repo' (one dirty
    # file in the receiver repo). 'central-only' is retained as a grandfathered
    # value for pre-2026-05-23 memos — no longer produced. There is no
    # central-only delivery path; an unregistered receiver hard-errors instead.
    values: [receiver-repo, central-only]
optional:
  # Related artifact paths (optional list of path strings)
  related: list-of-string
  # Supersession chain: set on the new memo when re-issuing a pre-lifecycle memo
  supersedes: string
  # Set by receiver when this memo is superseded by a newer one
  superseded_by: string
  # Lifecycle timestamps (populated by receiver-side Edit + commit on the memo file).
  # These are convenience metadata — authoritative audit trail is the commit itself.
  received_at: string
  received_by: string
  reviewed_at: string
  action_taken_at: string
  closed_at: string
  # Decision outcome (populated at action_taken time — F4 PM-endorsed):
  # required when status=action_taken (enforced via cross-field rule in schema.js).
  decision:
    type: enum
    values: [accepted, declined, partial, superseded]
  # Optional free-text rationale populated alongside decision
  decision_note: string
  # Optional note set by receiver at actioning time (free-text rationale or decision summary)
  actioned_note: string
  # Sender-declared shape of the memo (optional; absent = reader applies 'ask' default).
  # Spec backlink: docs/plans/2026-05-30-pickup-cross-repo-memo-fork.md § Pinned interface
  # Negative-spec: 'ack' is NOT a kind — acknowledgement is receipt-state, not sender-declared.
  # Enum members: ask | consult | fyi. Validated via cross-field rule in schema.js (not YAML
  # enum type) so the grandfather cutoff and ack-specific hint are enforced consistently.
  kind: string
  # One-line memo summary (≤120 chars). Length enforced via cross-field rule in schema.js
  # for post-cutoff memos (created >= 2026-05-22 — the same grandfather boundary as the
  # rest of the cross-repo-memo ruleset).
  # Spec backlink: docs/plans/2026-05-29-handoff-schema-category-summary.md § Chunk 1
  summary: string

  # skills and CLIs referencing them don't fail on a missing directory.
  # Scaffold with .gitkeep (not README) — content accumulates organically; day-1
  # placeholder READMEs add noise without signal.
  #
  # Spec backlink: docs/plans/2026-06-08-tasks-state-folder-split.md § C4
  # ---------------------------------------------------------------------------


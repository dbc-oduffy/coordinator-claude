# canonical-structure.yaml — single source of truth for the document-structure scaffold.
#
# Purpose: consumed by scaffold-canonical-structure.sh, repo-setup, coordinator:setup,
# and the doctor probe to define EVERY canonical directory (and key file) in a coordinator-managed
# repo. No parallel dir lists in four places — one manifest, many consumers.
#
# Spec backlink: docs/plans/2026-05-23-cross-repo-single-surface-and-canonical-scaffold.md § Chunk 1
#
# Fields per entry:
#   path       — repo-relative path (trailing / = directory; no trailing / = file or hook)
#   creation   — eager (scaffold immediately with README) | lazy (create on first use)
#   schema     — schema name (file in schemas/<name>.yaml) or null
#   readme     — purpose text for the directory's README.md, or null (for files/hooks)
#
# EAGER entries: contract-bearing dirs (inbound cross-repo writers, schema-validated surfaces)
# and key files needed from day 1. Scaffold with README.md — real content, not .gitkeep.
#
# LAZY entries: purely-accumulative local dirs with no addressability requirement and no
# inbound writer. Created by their producing skill on first use.
#
# Source table: skills/repo-setup/SKILL.md lines 195–208 (EAGER/LAZY audit verdict).
# The ONLY new EAGER directory beyond that table is cross-repo/ (added by this plan).
# archive/cross-repo/ is LAZY — optional housekeeping destination, not required lifecycle.
# ---------------------------------------------------------------------------

entries:

  # ---------------------------------------------------------------------------
  # EAGER — present from day 1
  # ---------------------------------------------------------------------------

  # cross-repo/inbox/ is the active inbound channel for cross-repo memos. The CLI
  # (bin/cross-repo-memo) writes dirty files here so they surface in `git status`.
  # Eager because sibling EMs address THIS repo's cross-repo/inbox/ by name; the dir
  # must exist and be discoverable before any memo arrives.
  - path: cross-repo/inbox/
    creation: eager
    schema: cross-repo-memo
    readme: |
      This directory is **this repo's active inbox** for cross-repo memos: messages
      addressed **to** this repo's EM by another repo's EM. Memos arrive as dirty
      (uncommitted) files so they surface in `git status`.

      ## Receiving — memos addressed to you land *here*

      A memo arrives with `status: open`. Read it, act, set `status: actioned` (add a
      `decision:` if relevant), and commit it into this repo. Closed memos are swept to
      `cross-repo/archive/` — the whole channel lives under `cross-repo/`.

      ## Sending — deliver to the RECIPIENT's box, **never your own**

      To send a memo, do **not** hand-write a file in this directory. This is *your*
      inbox; anything you drop here sits where the recipient never looks. Use the CLI:

      ```
      bin/cross-repo-memo --to <recipient-em> --topic <slug> --title "<one line>"
      ```

      It writes the memo into the **recipient's** `cross-repo/inbox/` (their inbox),
      leaves it dirty there, and prints the path to hand the PM for relay. The recipient
      sees it in *their* `git status`.

      ## Why writing into another repo's inbox is allowed

      General doctrine says: don't make changes in another repo. **Delivering a memo into
      a recipient's `cross-repo/inbox/` is the canonical exception** — it's a message, not
      a change to what runs (delivery-intent), and it is the one primitive that makes
      cross-repo coordination work at all. Send freely; the recipient owns what they do
      with it.

      ---
      Schema: `cross-repo/inbox/[0-9]*.md` is validated by `validate-frontmatter-schema.js`.
      Full doctrine: `coordinator/docs/wiki/cross-repo-communication.md`.

  # cross-repo/archive/ holds closed actioned memos (co-located with inbox/ under cross-repo/).
  # Lazy: memos are swept here after being actioned; not required on day 1.
  - path: cross-repo/archive/
    creation: lazy
    schema: null
    readme: |
      Closed actioned memos live here. There is NO sent/ — outbound memos live in the
      recipient's inbox (`cross-repo/inbox/`), not here.


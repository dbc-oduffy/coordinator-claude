# ---------------------------------------------------------------------------
# Cluster: system-prereq — machine-level prerequisite gate
# (SSOT: coordinator_core.install.prereq_probe, claude-klabauter)
#
# Reuses probe_all() from coordinator_core.install.prereq_probe (native
# Python port; this doctor sentinel no longer bridges to the DoE-side
# scripts/lib/prereq_probe.sh bash oracle it was ported from — that file
# was DELETED 2026-07-22, PM override of the prior DR-079 keep-as-vendor-SSOT
# ruling; project-rag-ue-addon and deep-research vendored it byte-stable and
# their parity gates go red until they re-vendor against the Python port)
# as the SSOT for every probe body.
# plugin_health/sentinel.py calls probe_all() in-process (DR-079); no
# probe logic is duplicated here. This is the doctor-probe-design.md §
# "A Probe Must Walk the Same Resolution Path as the Runtime Tool It Vouches For"
# implementation — the same NDJSON output the install Step Zero gate consumes is
# what the doctor verifies.
#
# Only hard-severity prereq failures drive RED (git, python, gh, node).
# Advisory-tier absences (uv, pwsh, ue, longpaths, git_lfs) stay GREEN per
# doctor-probe-design.md § "AMBER on Optional Absence Is Bad Form".
# ---------------------------------------------------------------------------

[[probe]]
id = "P-15"
cluster = "system-prereq"
weight = "standard"
interactivity = "silent"
fix = "none"
symptom_keywords = ["git not found", "python not found", "gh not found", "node not found", "system prerequisites", "prereq", "Step Zero", "install prerequisites", "missing dependency"]
triage = true
severity_if_fail = "error"
remediation = "Install the missing hard prerequisite(s): git (brew install git / apt-get install git), Python 3.11+ (https://python.org/downloads), GitHub CLI (brew install gh / winget install GitHub.cli), Node.js LTS (brew install node / winget install OpenJS.NodeJS.LTS)"

# ---------------------------------------------------------------------------
# Cluster: machine-local (continued) — hardware capacity SSOT
#
# P-16 checks that hardware.cores and hardware.ram_gb have been seeded into
# machine-local by the install-substrate hardware-audit step (C4 of plan
# docs/plans/2026-06-23-setup-time-substrate-completeness.md).  Absence means
# the worker-cap calculation in project-rag / build tools falls back to a
# conservative or wrong value.  This is a degraded (not error) verdict because
# the coordinator's own substrate is unaffected — downstream capacity budgets are
# the consequence, not immediate coordinator function.
#
# Remediation is population-aware: two install populations land here via
# different scripts (coordinator:install Phase 3 vs OSS setup/install.sh).
# ---------------------------------------------------------------------------

[[probe]]
id = "P-16"
cluster = "machine-local"
weight = "cheap"
interactivity = "silent"
fix = "none"
symptom_keywords = ["hardware absent", "hardware.cores missing", "hardware.ram_gb missing", "hardware capacity", "worker cap", "capacity budget", "hardware SSOT"]
triage = false
severity_if_fail = "degraded"
remediation = "hardware.cores / hardware.ram_gb absent from machine-local. Remediation depends on your install path: (1) coordinator:install users — re-run coordinator:install Phase 3 (the hardware-audit step seeds these values via lib/detect-hardware.py); (2) OSS setup/install.sh users — re-run setup/install.sh (the --setup-only path seeds hardware.* via the same detector). After re-running, verify with: machine-local get hardware.cores"

[[probe]]
id = "P-17"
cluster = "machine-local"
weight = "standard"
interactivity = "silent"
fix = "none"
symptom_keywords = ["shell", "login-shell", "bash-profile", "local-bin", "path", "orphan", "shell-env"]
# triage=false: this probe spawns a login shell that sources arbitrary user rc files
# (nvm/pyenv/conda-init), which have latency and side effects unsuitable for the
# always-on cheap triage pass. Surfaces under --full / --symptom shell-env /
# --cluster machine-local. The triage=true => weight in {cheap,standard} invariant
# does not apply here because triage is false.
triage = false
severity_if_fail = "error"
remediation = "bash login shell orphaned ~/.local/bin — run coordinator:install or normalize-env.sh"

# ---------------------------------------------------------------------------
# Cluster: ue-overrides — UE override path verifier (OPTIONAL — silent skip if absent)
# ---------------------------------------------------------------------------

[[probe]]
id = "P-9"
cluster = "ue-overrides"
weight = "standard"
interactivity = "silent"
fix = "none"
symptom_keywords = ["ue override drift", "verify-ue-overrides", "ue plugin override", "enabledPlugins drift"]
triage = false
severity_if_fail = "degraded"
remediation = "Run verify-ue-overrides.py (no flags, inspect-only) and follow the remediation it prints. It names the registry key and the settings.json file itself, which is why this text does not: a private repo codename hardcoded here is rewritten by the publish-time depersonalization, and the published engine would then send you to a key no registry can hold. An unregistered UE repo is reported as not-applicable, not drift."

# ---------------------------------------------------------------------------
# Cluster: structure — install singularity (canonical-locus integrity)
# ---------------------------------------------------------------------------

[[probe]]
id = "P-18"
cluster = "structure"
weight = "standard"
interactivity = "silent"
fix = "none"
symptom_keywords = ["install singularity", "split install", "multiple clones", "doubled venv pin", "claude-home", "marketplace divergence", "symlink install"]
# triage=true: install-integrity is load-bearing — a split/divergent install silently
# loads a stale coordinator copy, so the cheap first-pass run must catch it. The check
# is file reads + git rev-parse + settings parse (weight=standard, no model/VRAM) —
# satisfies the triage=true => weight in {cheap,standard} invariant.
triage = true
severity_if_fail = "error"
remediation = "Multiple coordinator install trees or divergent registration detected — reconcile to a single ~/.claude install (remove stray clones/symlinks; align settings.json / settings.local.json / known_marketplaces.json; fix a doubled .claude/.claude venv pin by re-running /coordinator:install). Re-run /coordinator:install."

# ---------------------------------------------------------------------------
# Cluster: currency (continued) — release-currency advisory (git-tag anchor)
#
# P-19 is advisory-only: a "behind" or "differs" result surfaces an
# informational note but NEVER contributes a RED or AMBER verdict row.
# Implementation uses the advisory_notes bucket in the sentinel (not note_red /
# note_amber), so the verdict is not affected regardless of probe result.
#
# Rationale: currency is a convenience signal, not an integrity check —
# "behind latest release" does not mean the installed coordinator is broken.
# The boot hook (check-plugin-update-currency.sh) already surfaces this at
# session start; the doctor probe makes it reachable from the scalpel path
# (--cluster currency / --probe P-19 / --full) without making every bare
# :doctor call reach GitHub.
#
# Design notes (the Staff Engineer review constraints, non-negotiable):
#   triage = false  — network I/O (git ls-remote --tags) is unacceptable in
#                     the always-on cheap first-pass; scalpel/full only.
#   offline         → silent/inconclusive skip (never RED).
#   source_is_live  → silent GREEN (authoring machine; no nag expected).
#   behind / differs → advisory note only; verdict unchanged.
#
# Reuses lib/release-currency.sh exclusively — no duplicate currency mechanism.
# Checks coordinator-claude (mirrors the boot hook's repo set). Per-plugin
# action hints match the boot hook's _action_hint_for().
# severity_if_fail = "degraded" documents the declared severity level; the
# sentinel probe body uses note_advisory (not note_amber), so this field is
# documentation-only for P-19 and never contributes an AMBER verdict row.
# ---------------------------------------------------------------------------

[[probe]]
id = "P-19"
cluster = "currency"
weight = "standard"
interactivity = "silent"
fix = "none"
symptom_keywords = ["release currency", "plugin update available", "coordinator behind", "coordinator-update", "git tag currency", "release tag", "update available"]
triage = false
severity_if_fail = "degraded"
remediation = "Run `/coordinator-update` to update coordinator"

# ---------------------------------------------------------------------------
# Cluster: system-prereq (continued) — durable coordinator-root pointer probes
#
# P-20/P-21 are the DoE-side detect-and-advise complement to the claude-klabauter
# install-engine's durable-root provisioning (docs/plans/2026-07-21-durable-
# coordinator-root-pointer.md § C7/C8). Both are per-machine confirmation
# checks — they do not write or repair anything themselves (fix = "none",
# consistent with every other probe in this manifest).
# ---------------------------------------------------------------------------

[[probe]]
id = "P-20"
cluster = "system-prereq"
weight = "cheap"
interactivity = "silent"
fix = "none"
symptom_keywords = ["bash<4", "bash 3.2", "old bash on PATH", "system bash ahead of brew bash", "BASH_VERSINFO", "macos default bash"]
triage = true
severity_if_fail = "error"
remediation = "The bash resolved first on PATH is < 4 (macOS ships 3.2 at /bin/bash). Install a modern bash with your platform's package manager (brew install bash / apt-get install bash / dnf install bash) and ensure its install prefix (e.g. /opt/homebrew/bin, /usr/local/bin, or /usr/bin) precedes /bin on PATH; re-run /coordinator:install to re-verify."

[[probe]]
id = "P-21"
cluster = "system-prereq"
weight = "cheap"
interactivity = "silent"
fix = "none"
symptom_keywords = ["doe-root missing", "settings-home doe-root absent", ".doe-root pointer", "durable coordinator root pointer", "DR-072", "coordinator root unresolvable"]
triage = true
severity_if_fail = "error"
remediation = "No <settings-home>/machine-local/.doe-root pointer found (DR-072 durable location) and no legacy ~/.claude/.doe-root fallback either — re-run /coordinator:install to re-seed the durable coordinator-root pointer."

# ---------------------------------------------------------------------------
# P-22 — publish-targets.portable DoE-tracked vs live-install divergence.
# Closes code-reviewer Finding 1a (restore-oss-seed-wiki slice, 2026-07-21):
# the DoE-tracked setup/publish-targets.portable and the untracked live-
# install copy (usually ${CLAUDE_HOME:-$HOME}/.claude/setup/, PERCOLATE_ROOT
# rung 3) have no sync mechanism, and the seed-wiki-allowlist regression
# guard (test_publish_seed_wiki_allowlist.py) structurally cannot see the
# live copy. Machine-dependent (needs a live-install PERCOLATE_ROOT to
# compare against) — doctor-probe placement only, NOT the fast test tier,
# per the P-11 precedent immediately above.
# ---------------------------------------------------------------------------

[[probe]]
id = "P-22"
cluster = "structure"
weight = "standard"
interactivity = "silent"
fix = "none"
symptom_keywords = ["publish-targets.portable drift", "publish-targets divergence", "OSS mirror allowlist drift", "live install publish targets", "wiki seed allowlist re-drift", "percolate root publish targets mismatch"]
triage = false
severity_if_fail = "degraded"
remediation = "Run verify-publish-targets-portable-sync.py (no flags, inspect-only) to see which row(s) diverged and how; recover manually by hand-copying the correct row(s) between the DoE-tracked copy and the live-install copy — this check never syncs either copy itself."

# ---------------------------------------------------------------------------
# P-23 — claude-doe wrapper drift (~/.local/bin/claude-doe vs its repo source
# <claude_klabauter_root>/coordinator/bin/claude-doe.py). POSIX installs the wrapper as a
# symlink onto <settings-home>/bin/claude-doe (staleness structurally
# impossible there — see _install_claude_doe_wrapper's docstring,
# coordinator_core/install/maximalist.py); Windows has no equivalent-cost
# native symlink story and falls back to a shutil.copy2 byte-copy that can
# silently drift from the source on any edit until the next install pass,
# with nothing previously reporting the gap. This probe is that gap's
# regression net.
# ---------------------------------------------------------------------------

[[probe]]
id = "P-23"
cluster = "structure"
weight = "cheap"
interactivity = "silent"
fix = "none"
symptom_keywords = ["claude-doe wrapper drift", "claude-doe stale", "wrapper byte copy stale", "claude-doe not updated", "launcher fix had no effect"]
triage = false
severity_if_fail = "degraded"
remediation = "Re-publish the wrapper: re-run python scripts/setup.py (installer Step 3.5b, _install_claude_doe_wrapper in coordinator_core/install/maximalist.py) to sync ~/.local/bin/claude-doe from <claude_klabauter_root>/coordinator/bin/claude-doe.py"

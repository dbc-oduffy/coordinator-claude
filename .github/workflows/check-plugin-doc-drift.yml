name: Check Plugin Doc Drift

on:
  pull_request:
    branches: [main]
  push:
    branches:
      # Review: code-reviewer — narrower push coverage than validate-plugins.yml
      # (which also runs on work/**+feature/**) is unexplained upstream. No
      # intent could be recovered, so this comment stands in place of changing
      # trigger behaviour: align these triggers, or confirm doc-drift is meant
      # to be deferred to PR time, before touching this list.
      - 'main'

jobs:
  plugin-doc-drift:
    runs-on: ubuntu-latest
    # Review: security-audit-worker — least-privilege floor; job never writes.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Check plugin documentation drift
        run: python .github/scripts/check-plugin-doc-drift.py

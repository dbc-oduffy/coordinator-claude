name: Check Plugin Doc Drift

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'main'
      - 'work/**'
      - 'feature/**'

jobs:
  plugin-doc-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check plugin documentation drift
        run: python .github/scripts/check-plugin-doc-drift.py
